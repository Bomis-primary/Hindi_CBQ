<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .quiz-container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
      padding: 24px;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .question {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 20px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .option-btn:hover:not([disabled]) {
      background: #e2e8f0;
    }
    .option-btn.correct {
      background-color: #d4edda;
      border-color: #28a745;
      color: #155724;
    }
    .option-btn.wrong {
      background-color: #f8d7da;
      border-color: #dc3545;
      color: #721c24;
    }
    .hint-box {
      margin-top: 15px;
      padding: 10px;
      background-color: #e8f4f8;
      border-left: 4px solid #17a2b8;
      font-size: 14px;
      color: #0c5460;
      display: none;
    }
    .footer-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    .btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover {
      background: #0056b3;
    }
    .btn-secondary {
      background: #6c757d;
    }
    .btn-secondary:hover {
      background: #545b62;
    }
    .score-screen {
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="quiz-container" id="quizContainer">
    <div class="quiz-header">
      <span id="progress">प्रश्न 1 / 10</span>
      <span id="scoreTracker">अंक: 0</span>
    </div>
    
    <div class="question" id="questionText">प्रश्न यहाँ दिखाई देगा</div>
    
    <div class="options" id="optionsContainer"></div>

    <div class="hint-box" id="hintBox"></div>

    <div class="footer-actions">
      <button class="btn btn-secondary" id="hintBtn" onclick="toggleHint()">संकेत (Hint)</button>
      <button class="btn" id="nextBtn" onclick="nextQuestion()" style="display: none;">अगला प्रश्न</button>
    </div>
  </div>

  <script>
    const newQuizQuestions = [
      {
        scenario: "डॉ. ए.पी.जे. अब्दुल कलाम का जन्म कब और किस स्थान पर हुआ था?",
        options: [
          "15 अक्टूबर 1931 को रामेश्वरम में",
          "27 जुलाई 2015 को शिलांग में",
          "15 अगस्त 1947 को चेन्नई में",
          "26 जनवरी 1950 को तिरुचिरापल्ली में"
        ],
        answer: 0,
        hint: "उनका जन्म तमिलनाडु के एक छोटे से द्वीप शहर में हुआ था।"
      },
      {
        scenario: "अब्दुल कलाम के पिता जैनुलाब्दीन का मुख्य काम-धंधा क्या था?",
        options: [
          "अखबार बेचना",
          "मछुआरों को नाव किराए पर देना",
          "शिक्षक के रूप में पढ़ाना",
          "वैज्ञानिक अनुसंधान करना"
        ],
        answer: 1,
        hint: "वे समुद्र से जुड़े व्यवसाय में लोगों को साधन किराए पर देते थे।"
      },
      {
        scenario: "1914 में पंबन पुल बनने से पहले कलाम का परिवार कौन-सा समृद्ध व्यवसाय करता था?",
        options: [
          "मछली पकड़ने का व्यवसाय",
          "तीर्थयात्रियों को नाव से रामेश्वरम और धनुषकोडी ले जाना",
          "अखबार छापने और बाँटने का कार्य",
          "हवाई जहाज के उपकरण बनाने का काम"
        ],
        answer: 1,
        hint: "वे श्रद्धालुओं को एक स्थान से दूसरे स्थान नाव द्वारा पहुँचाते थे।"
      },
      {
        scenario: "डॉ. कलाम ने 1954 में सेंट जोसेफ कॉलेज, तिरुचिरापल्ली से किस विषय में स्नातक की डिग्री प्राप्त की?",
        options: [
          "वैमानिकी इंजीनियरिंग (Aeronautical Engineering)",
          "भौतिकी (Physics)",
          "गणित (Mathematics)",
          "रसायन विज्ञान (Chemistry)"
        ],
        answer: 1,
        hint: "यह विज्ञान की वह शाखा है जिसमें पदार्थ और ऊर्जा का अध्ययन किया जाता है।"
      },
      {
        scenario: "1955 में मद्रास इंस्टीट्यूट ऑफ टेक्नोलॉजी (MIT) में दाखिला लेकर कलाम ने किस विषय की पढ़ाई की?",
        options: [
          "वैमानिकी इंजीनियरिंग (Aeronautical Engineering)",
          "कंप्यूटर साइंस (Computer Science)",
          "सिविल इंजीनियरिंग (Civil Engineering)",
          "मैकेनिकल इंजीनियरिंग (Mechanical Engineering)"
        ],
        answer: 0,
        hint: "यह पढ़ाई हवाई जहाज़ बनाने और उड़ाने से जुड़ी होती है।"
      },
      {
        scenario: "वायुसेना के इंटरव्यू में कुल 25 उम्मीदवारों में से कलाम किस स्थान पर आए थे?",
        options: [
          "8वें स्थान पर",
          "9वें स्थान पर",
          "10वें स्थान पर",
          "15वें स्थान पर"
        ],
        answer: 1,
        hint: "केवल 8 लोगों का चयन हुआ था और वे चयन सूची में ठीक उनके पीछे थे।"
      },
      {
        scenario: "डॉ. कलाम के अनुसार 'सपना' क्या होता है?",
        options: [
          "सपना वह है जो आप सोते समय देखते हैं",
          "सपना वह है जो आपको सोने नहीं देता / जगाए रखता है",
          "सपना वह है जो कभी पूरा नहीं हो सकता",
          "सपना वह है जो केवल दिन में देखा जाता है"
        ],
        answer: 1,
        hint: "यह वह प्रेरणा है जो आपको निरंतर जागृत और कार्यशील रखती है।"
      },
      {
        scenario: "वर्ष 2007 में इंग्लैंड की रॉयल सोसाइटी ने डॉ. कलाम को किस सम्मान से नवाजा?",
        options: [
          "अंतरराष्ट्रीय पदक",
          "किंग चार्ल्स द्वितीय पदक",
          "नोबेल पुरस्कार",
          "रॉयल इंजीनियरिंग मेडल"
        ],
        answer: 1,
        hint: "यह पदक एक प्रसिद्ध ब्रिटिश राजा के नाम पर है।"
      },
      {
        scenario: "डॉ. कलाम को अपने खाली समय में कौन-सा संगीत वाद्ययंत्र बजाना पसंद था?",
        options: [
          "सितार",
          "वीणा",
          "बांसुरी",
          "तबला"
        ],
        answer: 1,
        hint: "यह भारत का एक प्राचीन तार वाला वाद्ययंत्र (string instrument) है।"
      },
      {
        scenario: "डॉ. कलाम द्वारा लिखित प्रसिद्ध आत्मकथा (Autobiography) का क्या नाम है?",
        options: [
          "माई जर्नी (My Journey)",
          "इग्नाइटेड माइंड्स (Ignited Minds)",
          "विंग्स ऑफ फायर (Wings of Fire)",
          "सपनों की उड़ान"
        ],
        answer: 2,
        hint: "इस पुस्तक के शीर्षक का अर्थ 'अग्नि की उड़ान' है।"
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const progress = document.getElementById('progress');
    const scoreTracker = document.getElementById('scoreTracker');
    const hintBox = document.getElementById('hintBox');
    const hintBtn = document.getElementById('hintBtn');
    const nextBtn = document.getElementById('nextBtn');
    const quizContainer = document.getElementById('quizContainer');

    function loadQuestion() {
      const currentQ = newQuizQuestions[currentQuestionIndex];
      questionText.textContent = `${currentQuestionIndex + 1}. ${currentQ.scenario}`;
      progress.textContent = `प्रश्न ${currentQuestionIndex + 1} / ${newQuizQuestions.length}`;
      scoreTracker.textContent = `अंक: ${score}`;
      
      optionsContainer.innerHTML = '';
      hintBox.style.display = 'none';
      hintBox.textContent = `संकेत: ${currentQ.hint}`;
      nextBtn.style.display = 'none';
      hintBtn.style.display = 'inline-block';

      currentQ.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => selectAnswer(idx);
        optionsContainer.appendChild(btn);
      });
    }

    function selectAnswer(selectedIndex) {
      const currentQ = newQuizQuestions[currentQuestionIndex];
      const buttons = optionsContainer.children;

      for (let i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
        if (i === currentQ.answer) {
          buttons[i].classList.add('correct');
        }
      }

      if (selectedIndex === currentQ.answer) {
        score++;
        scoreTracker.textContent = `अंक: ${score}`;
      } else {
        buttons[selectedIndex].classList.add('wrong');
      }

      nextBtn.style.display = 'inline-block';
    }

    function toggleHint() {
      if (hintBox.style.display === 'none') {
        hintBox.style.display = 'block';
      } else {
        hintBox.style.display = 'none';
      }
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < newQuizQuestions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      quizContainer.innerHTML = `
        <div class="score-screen">
          <h2>क्विज़ समाप्त!</h2>
          <p style="font-size: 20px;">आपका कुल स्कोर: <strong>${score} / ${newQuizQuestions.length}</strong></p>
          <button class="btn" onclick="location.reload()">पुनः प्रयास करें</button>
        </div>
      `;
    }

    // Start Quiz
    loadQuestion();
  </script>
</body>
</html>
