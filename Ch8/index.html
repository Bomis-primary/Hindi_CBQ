<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBQ Quiz Application</title>
<style>
  :root {
    --primary: #2563eb;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #d97706;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  
  .screen { display: none; width: 100%; max-width: 650px; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
  .screen.active { display: block; }

  /* 1. Centered Single Logo Screen */
  #logo-screen { 
    display: none; 
    min-height: 300px;
  }
  #logo-screen.active {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app-logo {
    max-width: 280px;
    max-height: 160px;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }

  /* Intro & End Screen */
  .meta-card { background: #f1f5f9; padding: 15px; border-radius: 8px; margin: 20px 0; text-align: left; }
  .meta-card p { margin: 8px 0; font-size: 1rem; }
  button.btn-action { background: var(--primary); color: white; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 6px; cursor: pointer; transition: 0.2s; }
  button.btn-action:hover { opacity: 0.9; }

  /* Game Area */
  .game-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 20px; font-weight: bold; }
  .timer-badge { background: #fee2e2; color: var(--danger); padding: 6px 12px; border-radius: 20px; font-size: 0.9rem; }
  .scenario-text { text-align: left; font-size: 1.1rem; line-height: 1.5; margin-bottom: 20px; }
  
  .options-grid { display: grid; gap: 12px; margin-bottom: 20px; }
  .btn-option { background: #ffffff; border: 2px solid #cbd5e1; padding: 14px; border-radius: 8px; font-size: 1rem; text-align: left; cursor: pointer; transition: 0.2s; }
  .btn-option:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
  .btn-option.disabled { cursor: not-allowed; }
  .btn-option.correct { background: #dcfce7; border-color: var(--success); color: #14532d; }
  .btn-option.incorrect { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; }

  .feedback-box, .hint-box { border-radius: 6px; padding: 12px; margin-top: 15px; font-weight: 600; text-align: left; }
  .hint-box { background: #fef3c7; color: var(--warning); border: 1px solid #fde68a; }
  .feedback-box.success { background: #dcfce7; color: var(--success); }
  .feedback-box.danger { background: #fee2e2; color: var(--danger); }
</style>
</head>
<body>

<!-- 1. Logo Screen (Only Logo centered) -->
<div id="logo-screen" class="screen active">
  <img src="assets/logo.png" alt="Innovine Logo" class="app-logo">
</div>

<!-- 2. Intro Screen -->
<div id="intro-screen" class="screen">
  <h2>Quiz Overview</h2>
  <div class="meta-card">
    <p><strong>Grade:</strong> Class 4</p>
    <p><strong>Subject:</strong> Hindi</p>
    <p><strong>Topic:</strong> सच्चा देशप्रेम (True Patriotism)</p>
    <p><strong>Total Questions:</strong> <span id="intro-q-count">0</span></p>
  </div>
  <button class="btn-action" onclick="startQuiz()">Start Quiz</button>
</div>

<!-- 3. Game Area Screen -->
<div id="game-screen" class="screen">
  <div class="game-header">
    <span>Score: <span id="live-score">0</span></span>
    <span class="timer-badge">⏱️ <span id="timer">45</span>s</span>
    <span>Q: <span id="q-idx">1</span>/<span id="q-total">0</span></span>
  </div>

  <div id="scenario" class="scenario-text"></div>
  <div id="options" class="options-grid"></div>

  <div id="hint-box" class="hint-box" style="display: none;"></div>
  <div id="feedback-box" class="feedback-box" style="display: none;"></div>
</div>

<!-- 4. End Screen -->
<div id="end-screen" class="screen">
  <h2>Quiz Completed!</h2>
  <div class="meta-card" style="text-align: center;">
    <p>Your Final Score</p>
    <h1 id="final-score" style="font-size: 3rem; color: var(--primary); margin: 10px 0;">0/0</h1>
  </div>
  <button class="btn-action" onclick="restartQuiz()">Restart Quiz</button>
</div>

<script>
const quizData = [
  {
    scenario: "अमन मेले में अपने माता-पिता के साथ घूम रहा था। भीड़ अधिक होने के कारण उसके पापा ने उसे क्या निर्देश दिया?",
    options: [
      "सड़क की ओर तेज भागना",
      "पापा का हाथ कसकर पकड़े रहना",
      "अकेले खिलौने की दुकान पर जाना",
      "झूले के पास जाकर खड़े हो जाना"
    ],
    answer: 1,
    hint: "सोचिए! भीड़-भाड़ वाली जगह पर बच्चों की सुरक्षा के लिए बड़े क्या सलाह देते हैं?"
  },
  {
    scenario: "मेले में घूमते समय अमन की माँ ने उसके मफ़लर को ठीक करते हुए उसे किस बात के लिए मना किया?",
    options: [
      "झूला झूलने से",
      "खिलौने खरीदने से",
      "सड़क की ओर भागने से",
      "जलेबी खाने से"
    ],
    answer: 2,
    hint: "माँ ने सड़क की सुरक्षा से जुड़ी हिदायत दी थी।"
  },
  {
    scenario: "अमन को मेले में एक दुकान पर नीले रंग का खिलौना बहुत पसंद आया। वह कौन-सा खिलौना था जिसे पापा ने उसे खरीद कर दिया?",
    options: [
      "छोटा घोड़ा",
      "छोटा हाथी",
      "सुंदर गुड़िया",
      "रंग-बिरंगी कार"
    ],
    answer: 1,
    hint: "पाठ में दुकान पर रखे नीले रंग के जानवर वाले खिलौने का उल्लेख है।"
  },
  {
    scenario: "राष्ट्रगान 'जन-गण-मन' शुरू होने पर सड़क पर चल रहे लोगों ने क्या किया?",
    options: [
      "वे तेजी से भागने लगे",
      "वे अपने काम में व्यस्त रहे",
      "वे सम्मानपूर्वक अपनी जगह पर खड़े हो गए",
      "वे तालियाँ बजाने लगे"
    ],
    answer: 2,
    hint: "राष्ट्रगान के प्रति सम्मान प्रकट करने का सही तरीका क्या होता है?"
  },
  {
    scenario: "अमन और उसके माता-पिता जब घर लौट रहे थे, तो रास्ते में एक विद्यालय के मैदान में बच्चे यूनिफॉर्म में क्या कर रहे थे?",
    options: [
      "खेल प्रतियोगिता में भाग ले रहे थे",
      "राष्ट्रगान गा रहे थे",
      "चित्रकला प्रतियोगिता कर रहे थे",
      "नाटकीय प्रस्तुति दे रहे थे"
    ],
    answer: 1,
    hint: "विद्यालय में 'जन-गण-मन' की मधुर धुन गूंज रही थी।"
  },
  {
    scenario: "राष्ट्रगान के दौरान एक छोटा बच्चा किस चीज़ के पीछे भागते-भागते सड़क पर पहुँचने वाला था?",
    options: [
      "गुब्बारे के पीछे",
      "रंगीन गेंद के पीछे",
      "कठपुतली के पीछे",
      "खिलौना गाड़ी के पीछे"
    ],
    answer: 1,
    hint: "वह गोल और रंगीन वस्तु के पीछे भाग रहा था।"
  },
  {
    scenario: "जब छोटा बच्चा सड़क की ओर भाग रहा था और सामने से बस आ रही थी, तब अमन ने राष्ट्रगान के दौरान अपनी जगह से हिले बिना क्या समझदारी दिखाई?",
    options: [
      "वह खुद दौड़कर बच्चे को पकड़ने गया",
      "उसने सुरक्षा गार्ड को तुरंत आवाज देकर सतर्क किया",
      "उसने अपनी आँखें बंद कर लीं",
      "वह बस चालक पर चिल्लाने लगा"
    ],
    answer: 1,
    hint: "अमन ने राष्ट्रगान का नियम भी बनाए रखा और गार्ड की मदद से बच्चे की सुरक्षा भी सुनिश्चित की।"
  },
  {
    scenario: "अमन द्वारा सतर्क किए जाने पर विद्यालय के सुरक्षा गार्ड ने क्या किया?",
    options: [
      "वे अमन पर गुस्सा हुए",
      "वे तेजी से दौड़े और बच्चे को सुरक्षित पीछे ले आए",
      "वे अपनी जगह पर चुपचाप खड़े रहे",
      "उन्होंने बस वाले को रुकने का इशारा किया"
    ],
    answer: 1,
    hint: "गार्ड ने तुरंत कार्रवाई करके बच्चे की जान बचाई।"
  },
  {
    scenario: "गार्ड अंकल ने अमन को समझाते हुए देशप्रेम की क्या परिभाषा या नया सबक दिया?",
    options: [
      "केवल सीमा पर लड़ना ही देशप्रेम है",
      "दूसरों की सुरक्षा, मदद और कर्तव्य निभाना भी सच्चा देशप्रेम है",
      "केवल राष्ट्रगान गाना ही देशभक्ति है",
      "नियमों को तोड़कर दूसरों की मदद करना ही देशभक्ति है"
    ],
    answer: 1,
    hint: "दूसरों की सेवा और सुरक्षा करना भी राष्ट्र सेवा का ही रूप है।"
  },
  {
    scenario: "भारत का राष्ट्रगान 'जन-गण-मन' किसने रचा था और इसे गाने में लगभग कितना समय लगता है?",
    options: [
      "बंकिम चंद्र चटर्जी (60 सेकंड)",
      "रवीन्द्रनाथ टैगोर (52 सेकंड)",
      "महात्मा गांधी (45 सेकंड)",
      "सुभाष चंद्र बोस (52 सेकंड)"
    ],
    answer: 1,
    hint: "पाठ के अंत में दिए गए 'यह भी जानें' खंड को याद कीजिए।"
  }
];

let currentQ = 0;
let score = 0;
let attempts = 0;
let timerVal = 45;
let timerInterval = null;

// Auto switch from Logo Screen to Intro Screen after 5 seconds
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('intro-q-count').textContent = quizData.length;
  setTimeout(() => {
    switchScreen('intro-screen');
  }, 5000);
});

function switchScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  currentQ = 0;
  score = 0;
  switchScreen('game-screen');
  loadQuestion();
}

function loadQuestion() {
  attempts = 0;
  timerVal = 45;
  document.getElementById('live-score').textContent = score;
  document.getElementById('q-idx').textContent = currentQ + 1;
  document.getElementById('q-total').textContent = quizData.length;
  document.getElementById('scenario').textContent = quizData[currentQ].scenario;
  
  const hintBox = document.getElementById('hint-box');
  const feedBox = document.getElementById('feedback-box');
  hintBox.style.display = 'none';
  feedBox.style.display = 'none';

  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';

  quizData[currentQ].options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'btn-option';
    btn.textContent = `${idx + 1}. ${opt}`;
    btn.onclick = () => handleAnswer(idx, btn);
    optionsDiv.appendChild(btn);
  });

  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  document.getElementById('timer').textContent = timerVal;
  timerInterval = setInterval(() => {
    timerVal--;
    document.getElementById('timer').textContent = timerVal;
    if (timerVal <= 0) {
      clearInterval(timerInterval);
      handleTimeout();
    }
  }, 1000);
}

function handleAnswer(selectedIdx, btnElement) {
  const q = quizData[currentQ];
  const feedBox = document.getElementById('feedback-box');
  const hintBox = document.getElementById('hint-box');

  if (selectedIdx === q.answer) {
    clearInterval(timerInterval);
    btnElement.classList.add('correct');
    score++;
    document.getElementById('live-score').textContent = score;
    disableAllOptions();
    feedBox.className = 'feedback-box success';
    feedBox.textContent = 'Correct!';
    feedBox.style.display = 'block';
    hintBox.style.display = 'none';
    setTimeout(nextQuestion, 1000);
  } else {
    attempts++;
    btnElement.classList.add('incorrect');
    btnElement.disabled = true;

    if (attempts === 1) {
      hintBox.textContent = `Hint: ${q.hint}`;
      hintBox.style.display = 'block';
    } else if (attempts >= 2) {
      clearInterval(timerInterval);
      disableAllOptions();
      highlightCorrectOption();
      feedBox.className = 'feedback-box danger';
      feedBox.textContent = `Incorrect! Correct answer: ${q.options[q.answer]}`;
      feedBox.style.display = 'block';
      hintBox.style.display = 'none';
      setTimeout(nextQuestion, 2000);
    }
  }
}

function handleTimeout() {
  disableAllOptions();
  highlightCorrectOption();
  const feedBox = document.getElementById('feedback-box');
  feedBox.className = 'feedback-box danger';
  feedBox.textContent = `Time expired! Correct answer: ${quizData[currentQ].options[quizData[currentQ].answer]}`;
  feedBox.style.display = 'block';
  setTimeout(nextQuestion, 2000);
}

function disableAllOptions() {
  document.querySelectorAll('.btn-option').forEach(b => b.disabled = true);
}

function highlightCorrectOption() {
  const options = document.querySelectorAll('.btn-option');
  options[quizData[currentQ].answer].classList.add('correct');
}

function nextQuestion() {
  currentQ++;
  if (currentQ < quizData.length) {
    loadQuestion();
  } else {
    endQuiz();
  }
}

function endQuiz() {
  clearInterval(timerInterval);
  document.getElementById('final-score').textContent = `${score} / ${quizData.length}`;
  switchScreen('end-screen');
}

function restartQuiz() {
  switchScreen('intro-screen');
}
</script>
</body>
</html>
