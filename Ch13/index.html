<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पाठ १३: हिम्मत की दौड़ - CBQ 10 Questions Quiz</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #d97706;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  
  .screen { display: none; width: 100%; max-width: 650px; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
  .screen.active { display: block; }

  /* 1. Centered Single Logo Screen */
  #logo-screen { 
    display: none; 
    min-height: 300px;
  }
  #logo-screen.active {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app-logo {
    max-width: 280px;
    max-height: 160px;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }

  /* Intro & End Screen */
  .meta-card { background: #f1f5f9; padding: 15px; border-radius: 8px; margin: 20px 0; text-align: left; }
  .meta-card p { margin: 8px 0; font-size: 1rem; }
  button.btn-action { background: var(--primary); color: white; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: bold; }
  button.btn-action:hover { background: var(--primary-hover); }

  /* Game Area */
  .game-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 20px; font-weight: bold; }
  .timer-badge { background: #fee2e2; color: var(--danger); padding: 6px 12px; border-radius: 20px; font-size: 0.9rem; }
  .scenario-text { text-align: left; font-size: 1.1rem; line-height: 1.5; margin-bottom: 20px; white-space: pre-line; }
  
  .options-grid { display: grid; gap: 12px; margin-bottom: 20px; }
  .btn-option { background: #ffffff; border: 2px solid #cbd5e1; padding: 14px; border-radius: 8px; font-size: 1rem; text-align: left; cursor: pointer; transition: 0.2s; color: var(--text); }
  .btn-option:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
  .btn-option:disabled { cursor: not-allowed; }
  .btn-option.correct { background: #dcfce7; border-color: var(--success); color: #14532d; }
  .btn-option.incorrect { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; }

  .feedback-box, .hint-box { border-radius: 6px; padding: 12px; margin-top: 15px; font-weight: 600; text-align: left; }
  .hint-box { background: #fef3c7; color: var(--warning); border: 1px solid #fde68a; }
  .feedback-box.success { background: #dcfce7; color: var(--success); }
  .feedback-box.danger { background: #fee2e2; color: var(--danger); }
</style>
</head>
<body>

<!-- 1. Logo Screen -->
<div id="logo-screen" class="screen active">
  <img src="assets/logo.png" alt="App Logo" class="app-logo">
</div>

<!-- 2. Intro Screen -->
<div id="intro-screen" class="screen">
  <h2>पाठ १३: हिम्मत की दौड़</h2>
  <div class="meta-card">
    <p><strong>प्रकार:</strong> योग्यता-आधारित प्रश्न (CBQ Quiz)</p>
    <p><strong>कुल प्रश्न:</strong> <span id="intro-q-count">0</span></p>
    <p><strong>समय:</strong> 45 सेकंड प्रति प्रश्न</p>
  </div>
  <button class="btn-action" onclick="startQuiz()">दौड़ शुरू करें (Start Quiz)</button>
</div>

<!-- 3. Game Area Screen -->
<div id="game-screen" class="screen">
  <div class="game-header">
    <span>अंक (Score): <span id="live-score">0</span></span>
    <span class="timer-badge">⏱️ <span id="timer">45</span>s</span>
    <span>प्रश्न: <span id="q-idx">1</span>/<span id="q-total">0</span></span>
  </div>

  <div id="scenario" class="scenario-text"></div>
  <div id="options" class="options-grid"></div>

  <div id="hint-box" class="hint-box" style="display: none;"></div>
  <div id="feedback-box" class="feedback-box" style="display: none;"></div>
</div>

<!-- 4. End Screen -->
<div id="end-screen" class="screen">
  <h2>क्विज़ समाप्त! (Quiz Completed)</h2>
  <div class="meta-card" style="text-align: center;">
    <p>आपका कुल परिणाम (Final Score)</p>
    <h1 id="final-score" style="font-size: 3rem; color: var(--primary); margin: 10px 0;">0/0</h1>
    <p id="final-message" style="font-weight: bold; margin-top: 10px;"></p>
  </div>
  <button class="btn-action" onclick="restartQuiz()">पुनः प्रयास करें (Restart Quiz)</button>
</div>

<script>
const quizData = [
  {
    scenario: "1. स्थितिजन्य विश्लेषण: चोट लगने के बाद भी डेरेक रेडमंड का स्ट्रेचर पर बैठने से इनकार कर आगे बढ़ना उनकी किस क्षमता को उजागर करता है?",
    options: [
      "(A) शारीरिक रूप से पूरी तरह स्वस्थ होना",
      "(B) मानसिक दृढ़ता और लक्ष्य के प्रति अटूट निष्ठा",
      "(C) खेल नियमों से अनजान होना",
      "(D) प्रतिस्पर्धियों को डराने का प्रयास करना"
    ],
    answer: 1,
    hint: "संकेत: डेरेक का यह कदम शारीरिक ताकत से ज्यादा उनके मानसिक संकल्प और कभी हार न मानने के जज्बे को दिखाता है।"
  },
  {
    scenario: "2. चरित्र मूल्यांकन: सुरक्षाकर्मियों की परवाह किए बिना मैदान में उतरकर पिता (जिम रेडमंड) द्वारा सहारा बनना किस मानवीय मूल्य को दर्शाता है?",
    options: [
      "(A) बिना इजाज़त नियमों को तोड़ना",
      "(B) संकट के समय बिना शर्त नैतिक व भावनात्मक संबल प्रदान करना",
      "(C) किसी भी तरह बेटे को पहला स्थान दिलाना",
      "(D) खेल संघ के फैसले का विरोध करना"
    ],
    answer: 1,
    hint: "संकेत: एक पिता का अपने बच्चे के सबसे मुश्किल क्षणों में उसके साथ मजबूती से खड़े रहना।"
  },
  {
    scenario: "3. जीवन अनुप्रयोग: यदि कोई छात्र परीक्षा की तैयारी के अंतिम दौर में बीमार हो जाए, तो इस पाठ के आधार पर उसे क्या दृष्टिकोण अपनाना चाहिए?",
    options: [
      "(A) परीक्षा में बैठना पूरी तरह छोड़ देना",
      "(B) परिणाम की चिंता किए बिना धैर्य और साहस से अपनी पूरी क्षमता के साथ प्रयास करना",
      "(C) अपनी परिस्थिति और भाग्य को दोष देना",
      "(D) परिजनों की सहायता लेने से इनकार करना"
    ],
    answer: 1,
    hint: "संकेत: परिणाम चाहे जो हो, कठिन परिस्थिति में भी अपना सर्वश्रेष्ठ प्रयास करना चाहिए।"
  },
  {
    scenario: "4. खेल भावना: फिनिश लाइन के बिल्कुल पास पहुँचकर पिता जिम रेडमंड ने डेरेक का हाथ क्यों छोड़ दिया?",
    options: [
      "(A) क्योंकि वे शारीरिक रूप से थक चुके थे",
      "(B) ताकि डेरेक आत्म-सम्मान के साथ स्वयं अपने पैरों पर फिनिश लाइन पार कर सके",
      "(C) क्योंकि सुरक्षाकर्मी उन्हें खींच रहे थे",
      "(D) ताकि डेरेक आधिकारिक रूप से स्वर्ण पदक प्राप्त कर सके"
    ],
    answer: 1,
    hint: "संकेत: पिता चाहते थे कि डेरेक की इस व्यक्तिगत यात्रा का अंतिम कदम उसका अपना हो।"
  },
  {
    scenario: "5. निष्कर्ष निर्माण: कोई पदक न मिलने पर भी स्टेडियम के 65,000 दर्शकों द्वारा खड़े होकर तालियाँ बजाने का मुख्य संदेश क्या है?",
    options: [
      "(A) दर्शक केवल अंतिम विजेता का सम्मान करते हैं",
      "(B) असली जीत केवल ट्रॉफी या मेडल जीतना नहीं, बल्कि गिरकर फिर उठ खड़े होना है",
      "(C) चोट के बाद दौड़ पूरी करना खेल नियमों में अनिवार्य है",
      "(D) दर्शक केवल समय बिताने के लिए ताली बजा रहे थे"
    ],
    answer: 1,
    hint: "संकेत: दर्शकों ने डेरेक के जुझारूपन, साहस और खेल भावना को सलाम किया था।"
  },
  {
    scenario: "6. तथ्य एवं तर्क:\nकथन (A): 1992 ओलंपिक में डेरेक को आधिकारिक रूप से Did Not Finish माना गया।\nकारण (R): ओलंपिक नियमों अनुसार बाहरी व्यक्ति की मदद लेने पर खिलाड़ी को आधिकारिक विजेता नहीं माना जाता।",
    options: [
      "(A) (A) और (R) दोनों सही हैं तथा (R), (A) की सही व्याख्या करता है",
      "(B) (A) और (R) दोनों सही हैं लेकिन व्याख्या सही नहीं है",
      "(C) (A) सही है लेकिन (R) गलत है",
      "(D) (A) गलत है लेकिन (R) सही है"
    ],
    answer: 0,
    hint: "संकेत: ओलंपिक के नियमों के अनुसार किसी अन्य व्यक्ति की सहायता लेने पर ट्रैक इवेंट में खिलाड़ी को डिस्क्वालिफाई कर दिया जाता है।"
  },
  {
    scenario: "7. व्याकरण अनुप्रयोग: 'दाँतों तले उँगली दबाना' मुहावरे का प्रयोग दर्शकों की किस प्रतिक्रिया के लिए उपयुक्त है?",
    options: [
      "(A) डेरेक के मैदान में गिर जाने पर",
      "(B) असह्य दर्द के बावजूद डेरेक के लँगड़ाते हुए दौड़ जारी रखने के दृश्य को देखकर",
      "(C) दौड़ की शुरुआती बंदूक की आवाज़ सुनकर",
      "(D) डेरेक द्वारा 1985 में नया राष्ट्रीय रिकॉर्ड बनाने पर"
    ],
    answer: 1,
    hint: "संकेत: 'दाँतों तले उँगली दबाना' मुहावरे का अर्थ है आश्चर्यचकित या दंग रह जाना।"
  },
  {
    scenario: "8. तुलनात्मक अध्ययन: पी.टी. उषा (1984) और डेरेक रेडमंड (1992) के ओलंपिक प्रदर्शन में क्या समानता दिखाई देती है?",
    options: [
      "(A) दोनों ने अपने-अपने खेलों में स्वर्ण पदक प्राप्त किया",
      "(B) दोनों ने 400m स्पर्धा में अपनी उत्कृष्ट प्रतिभा और दृढ़ इच्छाशक्ति का प्रदर्शन किया",
      "(C) दोनों ने चोट के कारण संन्यास लिया",
      "(D) दोनों ने केवल एशियाई खेलों में भाग लिया"
    ],
    answer: 1,
    hint: "संकेत: दोनों ही एथलीटों ने 400 मीटर की दौड़ में अपनी अदम्य इच्छाशक्ति दिखाई।"
  },
  {
    scenario: "9. समस्या निवारण: 250m पर गंभीर चोट लगने पर डेरेक ने क्या निर्णय लिया?",
    options: [
      "(A) मैदान छोड़ना और दोबारा दौड़ की माँग करना",
      "(B) स्ट्रेचर मना करके दर्द सहते हुए दौड़ पूरी करना ताकि सालों का सपना अधूरा न रहे",
      "(C) दूसरी लेन में दौड़ना और आराम करना",
      "(D) तुरंत संन्यास लेना और कोच को दोष देना"
    ],
    answer: 1,
    hint: "संकेत: उन्होंने मेडिकल टीम के स्ट्रेचर को मना कर लँगड़ाते हुए दौड़ खत्म करने का फैसला किया।"
  },
  {
    scenario: "10. HOTS: \"असली चैंपियन वह नहीं जो हमेशा जीतता है, बल्कि वह है जो गिरकर भी उठना जानता है।\" यह विचार क्या सीख देता है?",
    options: [
      "(A) असफलता मिलने पर तुरंत लक्ष्य बदल लेना चाहिए",
      "(B) रुकावटें अंतिम नहीं होतीं; पुनः प्रयास करना ही सफलता की कुंजी है",
      "(C) प्रतियोगिता में केवल तभी भाग लें जब जीत पक्की हो",
      "(D) पुरस्कार जीतना ही जीवन का एकमात्र उद्देश्य होना चाहिए"
    ],
    answer: 1,
    hint: "संकेत: यह पंक्ति हमें जीवन की चुनौतियों का डटकर सामना करने और दृढ़ रहने की सीख देती है।"
  }
];

let currentQ = 0;
let score = 0;
let attempts = 0;
let timerVal = 45;
let timerInterval = null;

// Display logo screen briefly for 5 seconds before going to Intro screen
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('intro-q-count').textContent = quizData.length;
  setTimeout(() => {
    switchScreen('intro-screen');
  }, 5000);
});

function switchScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  currentQ = 0;
  score = 0;
  switchScreen('game-screen');
  loadQuestion();
}

function loadQuestion() {
  attempts = 0;
  timerVal = 45;
  document.getElementById('live-score').textContent = score;
  document.getElementById('q-idx').textContent = currentQ + 1;
  document.getElementById('q-total').textContent = quizData.length;
  document.getElementById('scenario').textContent = quizData[currentQ].scenario;
  
  const hintBox = document.getElementById('hint-box');
  const feedBox = document.getElementById('feedback-box');
  hintBox.style.display = 'none';
  feedBox.style.display = 'none';

  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';

  quizData[currentQ].options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'btn-option';
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(idx, btn);
    optionsDiv.appendChild(btn);
  });

  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  document.getElementById('timer').textContent = timerVal;
  timerInterval = setInterval(() => {
    timerVal--;
    document.getElementById('timer').textContent = timerVal;
    if (timerVal <= 0) {
      clearInterval(timerInterval);
      handleTimeout();
    }
  }, 1000);
}

function handleAnswer(selectedIdx, btnElement) {
  const q = quizData[currentQ];
  const feedBox = document.getElementById('feedback-box');
  const hintBox = document.getElementById('hint-box');

  if (selectedIdx === q.answer) {
    clearInterval(timerInterval);
    btnElement.classList.add('correct');
    score++;
    document.getElementById('live-score').textContent = score;
    disableAllOptions();
    feedBox.className = 'feedback-box success';
    feedBox.textContent = 'सही उत्तर! (Correct)';
    feedBox.style.display = 'block';
    hintBox.style.display = 'none';
    setTimeout(nextQuestion, 1200);
  } else {
    attempts++;
    btnElement.classList.add('incorrect');
    btnElement.disabled = true;

    if (attempts === 1) {
      hintBox.textContent = q.hint;
      hintBox.style.display = 'block';
    } else if (attempts >= 2) {
      clearInterval(timerInterval);
      disableAllOptions();
      highlightCorrectOption();
      feedBox.className = 'feedback-box danger';
      feedBox.textContent = `गलत उत्तर! सही उत्तर है: ${q.options[q.answer]}`;
      feedBox.style.display = 'block';
      hintBox.style.display = 'none';
      setTimeout(nextQuestion, 2200);
    }
  }
}

function handleTimeout() {
  disableAllOptions();
  highlightCorrectOption();
  const feedBox = document.getElementById('feedback-box');
  feedBox.className = 'feedback-box danger';
  feedBox.textContent = `समय समाप्त! सही उत्तर है: ${quizData[currentQ].options[quizData[currentQ].answer]}`;
  feedBox.style.display = 'block';
  setTimeout(nextQuestion, 2200);
}

function disableAllOptions() {
  document.querySelectorAll('.btn-option').forEach(b => b.disabled = true);
}

function highlightCorrectOption() {
  const options = document.querySelectorAll('.btn-option');
  options[quizData[currentQ].answer].classList.add('correct');
}

function nextQuestion() {
  currentQ++;
  if (currentQ < quizData.length) {
    loadQuestion();
  } else {
    endQuiz();
  }
}

function endQuiz() {
  clearInterval(timerInterval);
  document.getElementById('final-score').textContent = `${score} / ${quizData.length}`;
  const msg = document.getElementById('final-message');
  if (score >= 8) {
    msg.textContent = "उत्कृष्ट प्रदर्शन! 🌟 आपने पाठ को बहुत अच्छी तरह समझा है।";
    msg.style.color = "var(--success)";
  } else {
    msg.textContent = "अच्छा प्रयास! एक बार पुनः पाठ पढ़ें और प्रयास करें। 👍";
    msg.style.color = "var(--warning)";
  }
  switchScreen('end-screen');
}

function restartQuiz() {
  switchScreen('intro-screen');
}
</script>
</body>
</html>
