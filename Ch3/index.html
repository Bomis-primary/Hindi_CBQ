<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पाठ 3: हवा महल - CBQ Quiz Application</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .screen.active {
            display: block;
        }

        /* 1. Logo Screen */
        #logo-screen {
            display: none;
            min-height: 300px;
        }

        #logo-screen.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-logo {
            max-width: 280px;
            max-height: 160px;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        /* UI Cards & Typography */
        .meta-card {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
            border: 1px solid var(--border);
        }

        .meta-card p {
            margin: 8px 0;
            font-size: 1rem;
        }

        h1, h2 {
            color: var(--primary);
            margin-bottom: 15px;
        }

        /* Game Header */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .timer-badge {
            background: #fee2e2;
            color: var(--danger);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: var(--text);
            text-align: left;
            line-height: 1.5;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-option {
            background-color: #ffffff;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            width: 100%;
        }

        .btn-option:hover:not(:disabled) {
            background-color: #eff6ff;
            border-color: var(--primary);
        }

        .btn-option:disabled {
            cursor: not-allowed;
        }

        .btn-option.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #14532d !important;
            font-weight: bold;
        }

        .btn-option.incorrect {
            background-color: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: #7f1d1d !important;
        }

        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 600;
        }

        .btn-action:hover {
            background-color: var(--primary-hover);
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
            margin: 15px 0;
        }

        .footer-controls {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- 1. Logo Screen -->
    <div id="logo-screen" class="screen active">
        <img src="assets/logo.png" alt="Innovine Logo" class="app-logo">
    </div>

    <!-- 2. Intro Screen -->
    <div id="intro-screen" class="screen">
        <h1>क्विज़ विवरण (Overview)</h1>
        <div class="meta-card">
            <p><strong>विषय (Subject):</strong> हिंदी</p>
            <p><strong>पाठ (Topic):</strong> पाठ 3: हवा महल / ऐतिहासिक धरोहर</p>
            <p><strong>कुल प्रश्न (Total Questions):</strong> <span id="intro-q-count">0</span></p>
            <p><strong>समय सीमा (Time Limit):</strong> 45 सेकंड प्रति प्रश्न</p>
        </div>
        <button class="btn-action" onclick="startQuiz()">प्रश्नोत्तरी शुरू करें</button>
    </div>

    <!-- 3. Game Area Screen -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <span>अंक: <span id="live-score">0</span></span>
            <span class="timer-badge">⏱️ <span id="timer">45</span>s</span>
            <span>प्रश्न: <span id="q-idx">1</span>/<span id="q-total">0</span></span>
        </div>

        <div id="question" class="question-text"></div>
        <div id="options" class="options-grid"></div>

        <div class="footer-controls">
            <button id="next-btn" class="btn-action" style="display: none;" onclick="nextQuestion()">अगला प्रश्न</button>
        </div>
    </div>

    <!-- 4. End Screen -->
    <div id="end-screen" class="screen">
        <h2>प्रश्नोत्तरी समाप्त!</h2>
        <div class="meta-card" style="text-align: center;">
            <p>आपका कुल स्कोर</p>
            <div id="final-score" class="score-display">0 / 0</div>
        </div>
        <button class="btn-action" onclick="restartQuiz()">पुनः प्रयास करें</button>
    </div>

    <script>
        const quizData = [
            {
                question: "प्रश्न 1: यदि आप किसी ऐतिहासिक स्थान पर घूमने जाएँ, तो वहाँ की सुंदरता के साथ-साथ आपको क्या करना चाहिए?",
                options: [
                    "क) केवल तस्वीरें खींचनी चाहिए।",
                    "ख) उस स्थान के इतिहास और महत्व के बारे में जानना चाहिए।",
                    "ग) वहाँ की वस्तुओं को छूना और नुकसान पहुँचाना चाहिए।",
                    "घ) जल्दी से वापस आ जाना चाहिए।"
                ],
                correct: 1
            },
            {
                question: "प्रश्न 2: हवा महल में इतने सारे झरोखे बनाने का मुख्य कारण क्या था?",
                options: [
                    "क) महल को और ऊँचा दिखाने के लिए",
                    "ख) सुंदर सजावट के लिए",
                    "ग) ठंडी हवा अंदर आने के लिए",
                    "घ) रोशनी को रोकने के लिए"
                ],
                correct: 2
            },
            {
                question: "प्रश्न 3: यदि किसी पुराने ऐतिहासिक भवन की देखभाल न की जाए, तो क्या हो सकता है?",
                options: [
                    "क) वह और सुंदर हो जाएगा।",
                    "ख) वह खराब होकर नष्ट हो सकता है।",
                    "ग) उसकी ऊँचाई बढ़ जाएगी।",
                    "घ) उसमें नए झरोखे बन जाएंगे।"
                ],
                correct: 1
            },
            {
                question: "प्रश्न 4: जयपुर को “गुलाबी नगरी” क्यों कहा जाता है?",
                options: [
                    "क) वहाँ केवल गुलाबी फूल उगते हैं।",
                    "ख) वहाँ की इमारतों को गुलाबी रंग से रंगा गया था।",
                    "ग) वहाँ के लोग गुलाबी कपड़े पहनते हैं।",
                    "घ) वहाँ का मौसम गुलाबी होता है।"
                ],
                correct: 1
            },
            {
                question: "प्रश्न 5: आप हवा महल देखने जाते हैं। वहाँ पहुँचकर आप सबसे अच्छा क्या करेंगे?",
                options: [
                    "क) दीवारों पर अपना नाम लिखेंगे।",
                    "ख) वहाँ की जानकारी पढ़ेंगे और स्वच्छता बनाए रखेंगे।",
                    "ग) झरोखों को छूकर नुकसान पहुँचाएँगे।",
                    "घ) वहाँ का कोई पत्थर अपने साथ ले जाएँगे।"
                ],
                correct: 1
            },
            {
                question: "प्रश्न 6: हवा महल को राजा के मुकुट जैसा क्यों बताया गया है?",
                options: [
                    "क) क्योंकि वह चमकदार धातु से बना था।",
                    "ख) क्योंकि उसका आकार और सुंदर बनावट आकर्षक थी।",
                    "ग) क्योंकि राजा वहाँ रहते थे।",
                    "घ) क्योंकि वह बहुत छोटा था।"
                ],
                correct: 1
            },
            {
                question: "प्रश्न 7: यदि आपको अपने शहर की किसी ऐतिहासिक जगह के बारे में लोगों को बताना हो, तो आप क्या करेंगे?",
                options: [
                    "क) उसके इतिहास और विशेषताओं को साझा करेंगे।",
                    "ख) उसके बारे में गलत जानकारी देंगे।",
                    "ग) लोगों को वहाँ जाने से रोकेंगे।",
                    "घ) उसके महत्व को छिपाएँगे।"
                ],
                correct: 0
            },
            {
                question: "प्रश्न 8: हवा महल और आधुनिक इमारतों में क्या अंतर हो सकता है?",
                options: [
                    "क) हवा महल में पुराने समय की वास्तुकला दिखाई देती है।",
                    "ख) दोनों बिल्कुल एक जैसे होते हैं।",
                    "ग) आधुनिक इमारतों में कोई खिड़की नहीं होती।",
                    "घ) हवा महल आज की तकनीक से बना है।"
                ],
                correct: 0
            },
            {
                question: "प्रश्न 9: हवा महल जैसे ऐतिहासिक स्थानों को सुरक्षित रखने के लिए हमें क्या करना चाहिए?",
                options: [
                    "क) वहाँ कूड़ा फैलाना चाहिए।",
                    "ख) नियमों का पालन करना और स्वच्छता बनाए रखनी चाहिए।",
                    "ग) दीवारों पर लिखना चाहिए।",
                    "घ) पुरानी चीजों को हटाना चाहिए।"
                ],
                correct: 1
            },
            {
                question: "प्रश्न 10: “हवा महल” पाठ से हमें क्या सीख मिलती है?",
                options: [
                    "क) केवल यात्रा करना ही महत्वपूर्ण है।",
                    "ख) ऐतिहासिक धरोहरों का महत्व समझना और उनकी रक्षा करना चाहिए।",
                    "ग) पुराने भवनों का कोई महत्व नहीं होता।",
                    "घ) केवल बड़े शहरों में घूमना चाहिए।"
                ],
                correct: 1
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let timerVal = 45;
        let timerInterval = null;

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('intro-q-count').textContent = quizData.length;
            setTimeout(() => {
                switchScreen('intro-screen');
            }, 5000);
        });

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            switchScreen('game-screen');
            loadQuestion();
        }

        function loadQuestion() {
            timerVal = 45;
            document.getElementById('live-score').textContent = score;
            document.getElementById('q-idx').textContent = currentQuestionIndex + 1;
            document.getElementById('q-total').textContent = quizData.length;
            document.getElementById('next-btn').style.display = 'none';

            const currentQuiz = quizData[currentQuestionIndex];
            document.getElementById('question').innerText = currentQuiz.question;

            const optionsElement = document.getElementById('options');
            optionsElement.innerHTML = "";

            currentQuiz.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = option;
                button.classList.add("btn-option");
                button.onclick = () => selectOption(index, button);
                optionsElement.appendChild(button);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            document.getElementById('timer').textContent = timerVal;
            timerInterval = setInterval(() => {
                timerVal--;
                document.getElementById('timer').textContent = timerVal;
                if (timerVal <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function selectOption(index, button) {
            clearInterval(timerInterval);
            const correctIndex = quizData[currentQuestionIndex].correct;
            const buttons = document.querySelectorAll(".btn-option");

            buttons.forEach(btn => btn.disabled = true);

            if (index === correctIndex) {
                button.classList.add("correct");
                score++;
                document.getElementById('live-score').textContent = score;
            } else {
                button.classList.add("incorrect");
                buttons[correctIndex].classList.add("correct");
            }

            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function handleTimeout() {
            const buttons = document.querySelectorAll(".btn-option");
            buttons.forEach(btn => btn.disabled = true);
            const correctIndex = quizData[currentQuestionIndex].correct;
            buttons[correctIndex].classList.add("correct");

            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            clearInterval(timerInterval);
            document.getElementById('final-score').textContent = `${score} / ${quizData.length}`;
            switchScreen('end-screen');
        }

        function restartQuiz() {
            switchScreen('intro-screen');
        }
    </script>
</body>
</html>
