<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>अभ्यास प्रश्नोत्तरी</title>
  <style>
    :root {
      --primary-color: #7b9acc;
      --primary-hover: #6382b3;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #4a5568;
      --correct-color: #82c99b;
      --incorrect-color: #f89898;
      --disabled-color: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .screen {
      background-color: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(148, 163, 184, 0.15);
      width: 100%;
      max-width: 600px;
      padding: 36px 28px;
      text-align: center;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 400px;
    }

    .active {
      display: flex;
    }

    /* 1. Splash Screen (Logo Image Only) */
    .logo-img {
      max-width: 220px;
      height: auto;
      object-fit: contain;
      user-select: none;
    }

    /* 2. Instruction Screen */
    .instruction-title {
      font-size: 1.5rem;
      margin-bottom: 18px;
      color: var(--text-color);
      font-weight: 700;
    }

    .instruction-text {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #64748b;
      margin-bottom: 30px;
      background: #f8fafc;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
    }

    /* 3. Quiz Screen */
    .quiz-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 24px;
      width: 100%;
      text-align: left;
      line-height: 1.5;
      color: #334155;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-bottom: 20px;
    }

    .option-btn {
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-color);
      width: 100%;
      line-height: 1.4;
    }

    .option-btn:hover:not([disabled]) {
      border-color: var(--primary-color);
      background-color: #f1f5f9;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--correct-color) !important;
      color: #2e7d32;
      font-weight: 600;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--incorrect-color) !important;
      color: #c62828;
    }

    .status-msg {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 16px;
      min-height: 22px;
    }

    .status-msg.error { color: #e57373; }
    .status-msg.success { color: #81c784; }

    /* Rationale Box */
    .rationale-box {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 20px;
      display: none;
    }

    .rationale-box.correct {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }

    .rationale-box.wrong {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }

    /* General Button */
    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      box-shadow: 0 4px 12px rgba(123, 154, 204, 0.3);
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      background-color: var(--disabled-color);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 4. Completion Screen */
    .completion-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }

    .completion-title {
      font-size: 2rem;
      color: var(--primary-color);
      margin-bottom: 10px;
      font-weight: 700;
    }

    .completion-msg {
      font-size: 1.1rem;
      color: #64748b;
      margin-bottom: 28px;
    }

    @media (max-width: 480px) {
      .screen {
        padding: 24px 18px;
        min-height: 340px;
      }
      .logo-img { max-width: 180px; }
      .question-text { font-size: 1.05rem; }
      .option-btn { padding: 12px 14px; font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <!-- Screen 1: Logo Splash ONLY (5 Seconds) -->
  <div id="screen-splash" class="screen active">
    <img src="assets/innovine-logo 1.png" alt="Innovine Logo" class="logo-img">
  </div>

  <!-- Screen 2: Instructions (No Logo) -->
  <div id="screen-instructions" class="screen">
    <div class="instruction-title">निर्देश (Instructions)</div>
    <div class="instruction-text">
      प्रत्येक प्रश्न का उत्तर ध्यानपूर्वक दें।<br>
      आपको प्रति प्रश्न <strong>2 प्रयास (Attempts)</strong> मिलेंगे।<br>
      दोनों प्रयास गलत होने पर सही उत्तर प्रदर्शित किया जाएगा।
    </div>
    <button class="btn" onclick="startQuiz()">प्रश्नोत्तरी शुरू करें</button>
  </div>

  <!-- Screen 3: Quiz -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-header">
      <span id="question-progress">प्रश्न 1/10</span>
      <span id="attempts-left">प्रयास शेष: 2</span>
    </div>
    
    <div id="question-text" class="question-text">Loading question...</div>
    
    <div id="options-container" class="options-container"></div>
    
    <div id="status-msg" class="status-msg"></div>

    <div id="rationale-box" class="rationale-box"></div>
    
    <button id="next-btn" class="btn" onclick="handleNext()" disabled>अगला प्रश्न</button>
  </div>

  <!-- Screen 4: Completion Page -->
  <div id="screen-completion" class="screen">
    <div class="completion-icon">🎉</div>
    <div class="completion-title">बधाई हो! (Congratulations!)</div>
    <div class="completion-msg">आपने सफलतापूर्वक प्रश्नोत्तरी पूरी कर ली है!</div>
    <button class="btn" onclick="restartQuiz()">पुनः प्रयास करें</button>
  </div>

  <audio id="sound-wrong" src="assets/wrong 1.mp3"></audio>
  <audio id="sound-correct" src="assets/correct 1.mp3"></audio>

  <script>
    const questions = [
      {
        questionNumber: 1,
        question: "यदि कोई व्यक्ति आपसे मदद माँगता है, तो कहानी के अनुसार आपको क्या करना चाहिए?",
        options: [
          { text: "क) बिना सोचे तुरंत मदद कर देनी चाहिए।", rationale: "बिना सोचे-समझे मदद करने से कभी-कभी बड़ा नुकसान हो सकता है।", isCorrect: false },
          { text: "ख) मदद करने से पहले परिस्थिति को समझना चाहिए।", rationale: "मदद करने से पहले परिस्थिति और परिणामों का सही मूल्यांकन करना समझदारी है।", isCorrect: true },
          { text: "ग) किसी की भी मदद नहीं करनी चाहिए।", rationale: "किसी की भी मदद न करना संवेदनहीनता है, जो सही व्यवहार नहीं है।", isCorrect: false },
          { text: "घ) केवल अपने बारे में सोचना चाहिए।", rationale: "केवल अपने बारे में सोचना स्वार्थ है, जिससे सामाजिक सहयोग समाप्त हो जाता है।", isCorrect: false }
        ]
      },
      {
        questionNumber: 2,
        question: "आम के पेड़ का स्वभाव दयालु था, लेकिन उसकी एक गलती से जंगल को नुकसान हुआ। इससे क्या सीख मिलती है?",
        options: [
          { text: "क) दया करना हमेशा गलत होता है।", rationale: "दया एक बहुत अच्छा गुण है, इसे पूरी तरह गलत नहीं माना जा सकता।", isCorrect: false },
          { text: "ख) दया के साथ समझदारी भी आवश्यक है।", rationale: "सच्ची सहायता वही है जो दया और विवेक दोनों के संतुलन से की जाए।", isCorrect: true },
          { text: "ग) किसी की सहायता नहीं करनी चाहिए।", rationale: "दूसरों की सहायता करना मानवीय गुण है, इसलिए सहायता बंद नहीं करनी चाहिए।", isCorrect: false },
          { text: "घ) पेड़ों को दूसरों पर विश्वास नहीं करना चाहिए।", rationale: "विश्वास और सहयोग जीवन के लिए ज़रूरी हैं, पर विवेक के साथ।", isCorrect: false }
        ]
      },
      {
        questionNumber: 3,
        question: "यदि आपका मित्र बिना सोचे किसी अजनबी पर विश्वास कर ले, तो आप उसे क्या सलाह देंगे?",
        options: [
          { text: "क) उसे ऐसा ही करते रहने देंगे।", rationale: "मित्र को सही रास्ता न दिखाना और चुप रहना मित्रधर्म नहीं है।", isCorrect: false },
          { text: "ख) उसे सावधानी से निर्णय लेने के लिए समझाएँगे।", rationale: "सच्चा मित्र वही है जो सही और गलत की पहचान कराकर सचेत करे।", isCorrect: true },
          { text: "ग) उससे बात करना बंद कर देंगे।", rationale: "बात बंद करने से मित्र की समस्या दूर नहीं होगी।", isCorrect: false },
          { text: "घ) उसकी मदद नहीं करेंगे।", rationale: "मित्र को मुसीबत या गलत निर्णय से बचाना हमारी ज़िम्मेदारी है।", isCorrect: false }
        ]
      },
      {
        questionNumber: 4,
        question: "यदि आम का पेड़ लकड़हारे को लकड़ी न देता, तो क्या हो सकता था?",
        options: [
          { text: "क) लकड़हारा पेड़ों को काटने में सक्षम नहीं होता।", rationale: "लकड़ी का हत्था न मिलने से वह कुल्हाड़ी से पेड़ों को काट नहीं पाता।", isCorrect: true },
          { text: "ख) जंगल तुरंत नष्ट हो जाता।", rationale: "कुल्हाड़ी का हत्था न होने से लकड़हारा पेड़ नहीं काट पाता, अतः जंगल नष्ट नहीं होता।", isCorrect: false },
          { text: "ग) सभी पेड़ सूख जाते।", rationale: "लकड़हारे के पास साधन न होने से पेड़ सुरक्षित रहते।", isCorrect: false },
          { text: "घ) पक्षी जंगल छोड़ देते।", rationale: "जंगल सुरक्षित रहने पर पक्षियों के आवास को कोई खतरा नहीं होता।", isCorrect: false }
        ]
      },
      {
        questionNumber: 5,
        question: "यदि किसी जंगल में पेड़ों की कटाई लगातार होती रहे, तो उसका क्या प्रभाव होगा?",
        options: [
          { text: "क) जानवरों को अधिक घर मिलेंगे।", rationale: "पेड़ कटने से जानवरों के प्राकृतिक आवास नष्ट हो जाते हैं।", isCorrect: false },
          { text: "ख) जंगल में हरियाली और जीवन कम हो जाएगा।", rationale: "वृक्षों की कमी से पर्यावरण का संतुलन बिगड़ता है और हरियाली समाप्त होती है।", isCorrect: true },
          { text: "ग) बारिश अधिक होने लगेगी।", rationale: "पेड़ वर्षा लाने में सहायक होते हैं, अतः कटाई से बारिश कम होगी।", isCorrect: false },
          { text: "घ) पक्षियों की संख्या बढ़ जाएगी।", rationale: "आश्रय नष्ट होने से पक्षियों की संख्या घट जाएगी।", isCorrect: false }
        ]
      },
      {
        questionNumber: 6,
        question: "नीम और पीपल के पेड़ की सोच आम के पेड़ से किस प्रकार अलग थी?",
        options: [
          { text: "क) वे किसी की मदद नहीं करना चाहते थे।", rationale: "वे पूरी तरह स्वार्थी नहीं थे, बल्कि संभावित खतरे के प्रति सतर्क थे।", isCorrect: false },
          { text: "ख) वे मदद करने से पहले सोच-विचार करना चाहते थे।", rationale: "वे परिस्थिति और परिणामों का सही आकलन करके निर्णय लेना चाहते थे।", isCorrect: true },
          { text: "ग) वे जंगल छोड़ना चाहते थे।", rationale: "कहानी में उनके जंगल छोड़ने की बात नहीं है।", isCorrect: false },
          { text: "घ) वे लकड़हारे से डरते थे।", rationale: "डर के बजाय वे विवेक और समझदारी का परिचय दे रहे थे।", isCorrect: false }
        ]
      },
      {
        questionNumber: 7,
        question: "यदि आप उस समय जंगल में मौजूद होते, जब लकड़हारा पेड़ काटने आया, तो आप क्या करते?",
        options: [
          { text: "क) लकड़हारे को रोकने और पेड़ों को बचाने का प्रयास करते।", rationale: "पेड़ों और पर्यावरण की रक्षा करना हम सभी का परम कर्तव्य है।", isCorrect: true },
          { text: "ख) चुपचाप वहाँ से चले जाते।", rationale: "गलत काम होते देखकर चुप रहना या भाग जाना सही नहीं है।", isCorrect: false },
          { text: "ग) उसे और लकड़ी देते।", rationale: "पर्यावरण के विनाश में सहयोग देना अनुचित है।", isCorrect: false },
          { text: "घ) पेड़ों को काटने में उसकी सहायता करते।", rationale: "पेड़ों की कटाई में मदद करना प्रकृति के प्रतिकूल है।", isCorrect: false }
        ]
      },
      {
        questionNumber: 8,
        question: "“दया करो, पर समझदारी के साथ” कहानी की इस सीख का सही अर्थ क्या है?",
        options: [
          { text: "क) किसी की सहायता कभी नहीं करनी चाहिए।", rationale: "सहायता न करने से समाज में सहानुभूति समाप्त हो जाएगी।", isCorrect: false },
          { text: "ख) सहायता करते समय परिणामों के बारे में भी सोचना चाहिए।", rationale: "मदद करते समय यह ध्यान रखना ज़रूरी है कि इससे किसी बड़े नुकसान का मार्ग न खुले।", isCorrect: true },
          { text: "ग) केवल अपने लाभ के लिए काम करना चाहिए।", rationale: "केवल स्वार्थ देखना सही जीवन-मूल्य नहीं है।", isCorrect: false },
          { text: "घ) दूसरों पर कभी विश्वास नहीं करना चाहिए।", rationale: "विश्वास आवश्यक है, पर अंधविश्वास नहीं।", isCorrect: false }
        ]
      },
      {
        questionNumber: 9,
        question: "यदि कोई विद्यार्थी अपनी गलती स्वीकार करके उससे सीखता है, तो वह किस पात्र की सीख को अपनाता है?",
        options: [
          { text: "क) लकड़हारा", rationale: "लकड़हारा लालची और अनुचित आचरण का प्रतीक था।", isCorrect: false },
          { text: "ख) बरगद", rationale: "बरगद का पेड़ केवल एक मूकदर्शक पात्र था।", isCorrect: false },
          { text: "ग) आम का पेड़", rationale: "आम के पेड़ ने अपनी भूल महसूस की और उससे जीवन भर के लिए सबक सीखा।", isCorrect: true },
          { text: "घ) पक्षी", rationale: "पक्षी इस सीख के मुख्य आधार पात्र नहीं थे।", isCorrect: false }
        ]
      },
      {
        questionNumber: 10,
        question: "कहानी का मुख्य संदेश क्या है?",
        options: [
          { text: "क) सभी से डरकर रहना चाहिए।", rationale: "डर में जीना कहानी का संदेश नहीं है।", isCorrect: false },
          { text: "ख) केवल दयालु होना ही पर्याप्त है।", rationale: "बिना समझदारी की दया कभी-कभी अहित कर सकती है।", isCorrect: false },
          { text: "ग) निर्णय लेते समय दया और समझदारी दोनों आवश्यक हैं।", rationale: "दया और बुद्धिमत्ता का सही संतुलन ही जीवन में सही निर्णय लेने में मदद करता है।", isCorrect: true },
          { text: "घ) पेड़ों को मनुष्यों से दूर रहना चाहिए।", rationale: "मनुष्य और प्रकृति का सह-अस्तित्व अनिवार्य है।", isCorrect: false }
        ]
      }
    ];

    let currentQuestionIndex = 0;
    let attemptsLeft = 2;
    let questionResolved = false;

    // Screens
    const screenSplash = document.getElementById('screen-splash');
    const screenInstructions = document.getElementById('screen-instructions');
    const screenQuiz = document.getElementById('screen-quiz');
    const screenCompletion = document.getElementById('screen-completion');

    // Quiz UI Elements
    const questionProgress = document.getElementById('question-progress');
    const attemptsLeftText = document.getElementById('attempts-left');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const statusMsg = document.getElementById('status-msg');
    const rationaleBox = document.getElementById('rationale-box');
    const nextBtn = document.getElementById('next-btn');

    // Audio Elements
    const soundWrong = document.getElementById('sound-wrong');
    const soundCorrect = document.getElementById('sound-correct');

    // 5-second Splash screen transition (Logo ONLY on startup)
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        screenSplash.classList.remove('active');
        screenInstructions.classList.add('active');
      }, 5000);
    });

    function startQuiz() {
      currentQuestionIndex = 0;
      screenInstructions.classList.remove('active');
      screenQuiz.classList.add('active');
      loadQuestion();
    }

    function loadQuestion() {
      attemptsLeft = 2;
      questionResolved = false;
      
      const q = questions[currentQuestionIndex];
      
      questionProgress.innerText = `प्रश्न ${currentQuestionIndex + 1}/${questions.length}`;
      attemptsLeftText.innerText = `प्रयास शेष: ${attemptsLeft}`;
      questionText.innerText = `${q.question}`;
      
      statusMsg.innerText = "";
      statusMsg.className = "status-msg";
      
      rationaleBox.style.display = "none";
      rationaleBox.className = "rationale-box";
      rationaleBox.innerHTML = "";

      nextBtn.disabled = true;

      optionsContainer.innerHTML = "";
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt.text;
        btn.onclick = () => handleOptionSelect(idx, btn, opt);
        optionsContainer.appendChild(btn);
      });
    }

    function handleOptionSelect(index, btn, optionData) {
      if (questionResolved) return;

      const q = questions[currentQuestionIndex];
      const optionButtons = optionsContainer.querySelectorAll('.option-btn');

      if (optionData.isCorrect) {
        // Correct Answer
        btn.classList.add('correct');
        statusMsg.innerText = "सही उत्तर!";
        statusMsg.className = "status-msg success";
        
        try {
          soundCorrect.currentTime = 0;
          soundCorrect.play();
        } catch(e) {}

        showRationale(true, optionData.rationale);
        resolveQuestion();
      } else {
        // Incorrect Answer
        attemptsLeft--;
        btn.classList.add('incorrect');
        btn.disabled = true;

        try {
          soundWrong.currentTime = 0;
          soundWrong.play();
        } catch(e) {}

        if (attemptsLeft > 0) {
          attemptsLeftText.innerText = `प्रयास शेष: ${attemptsLeft}`;
          statusMsg.innerText = "गलत उत्तर! 1 प्रयास और शेष है।";
          statusMsg.className = "status-msg error";
        } else {
          // Out of attempts
          attemptsLeftText.innerText = `प्रयास शेष: 0`;
          statusMsg.innerText = "गलत उत्तर! सही उत्तर नीचे दिखाया गया है।";
          statusMsg.className = "status-msg error";

          // Find correct option and highlight it
          const correctIdx = q.options.findIndex(o => o.isCorrect);
          optionButtons[correctIdx].classList.add('correct');

          showRationale(false, q.options[correctIdx].rationale);
          resolveQuestion();
        }
      }
    }

    function showRationale(isCorrect, rationaleText) {
      rationaleBox.style.display = "block";
      if (isCorrect) {
        rationaleBox.className = "rationale-box correct";
        rationaleBox.innerHTML = `<strong>✅ सही उत्तर!</strong><br>${rationaleText}`;
      } else {
        rationaleBox.className = "rationale-box wrong";
        rationaleBox.innerHTML = `<strong>❌ स्पष्टीकरण:</strong><br>${rationaleText}`;
      }
    }

    function resolveQuestion() {
      questionResolved = true;
      nextBtn.disabled = false;
      
      const optionButtons = optionsContainer.querySelectorAll('.option-btn');
      optionButtons.forEach(btn => btn.disabled = true);

      if (currentQuestionIndex === questions.length - 1) {
        nextBtn.innerText = "समाप्त करें";
      } else {
        nextBtn.innerText = "अगला प्रश्न";
      }
    }

    function handleNext() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        loadQuestion();
      } else {
        showCompletion();
      }
    }

    function showCompletion() {
      screenQuiz.classList.remove('active');
      screenCompletion.classList.add('active');
    }

    function restartQuiz() {
      screenCompletion.classList.remove('active');
      screenInstructions.classList.add('active');
    }
  </script>
</body>
</html>
