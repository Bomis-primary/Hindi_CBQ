<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पाठ 11: एक अनोखा तरबूज़ - Quiz</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --correct-color: #4caf50;
            --incorrect-color: #f44336;
            --border-color: #e9ecef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .screen {
            display: none;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            text-align: center;
        }

        .screen.active {
            display: block;
        }

        /* 1. Logo Screen */
        #logo-screen {
            display: none;
            min-height: 300px;
        }

        #logo-screen.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-logo {
            max-width: 280px;
            max-height: 160px;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        /* Meta Cards & Common UI */
        .meta-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
            border: 1px solid var(--border-color);
        }

        .meta-card p {
            margin: 8px 0;
            font-size: 1rem;
        }

        h1, h2 {
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: left;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-color);
            width: 100%;
        }

        .option-btn:hover:not([disabled]) {
            background-color: #e8f5e9;
            border-color: var(--primary-color);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: var(--correct-color) !important;
            color: #155724 !important;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: #f8d7da !important;
            border-color: var(--incorrect-color) !important;
            color: #721c24 !important;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 600;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .score-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 15px 0;
        }

        .timer-badge {
            background: #fee2e2;
            color: #dc2626;
            padding: 4px 10px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<!-- 1. Logo Screen -->
<div id="logo-screen" class="screen active">
    <img src="assets/logo.png" alt="Innovine Logo" class="app-logo">
</div>

<!-- 2. Intro Screen -->
<div id="intro-screen" class="screen">
    <h1>पाठ विवरण (Overview)</h1>
    <div class="meta-card">
        <p><strong>विषय (Subject):</strong> हिंदी</p>
        <p><strong>पाठ (Topic):</strong> पाठ 11: एक अनोखा तरबूज़</p>
        <p><strong>कुल प्रश्न (Total Questions):</strong> <span id="intro-q-count">0</span></p>
    </div>
    <button class="btn" onclick="startQuiz()">प्रश्नोत्तरी शुरू करें</button>
</div>

<!-- 3. Game Area Screen -->
<div id="game-screen" class="screen">
    <div class="game-header">
        <span>अंक: <span id="live-score">0</span></span>
        <span class="timer-badge">⏱️ <span id="timer">45</span>s</span>
        <span>प्रश्न: <span id="q-idx">1</span>/<span id="q-total">0</span></span>
    </div>

    <div id="question" class="question-text"></div>
    <div id="options" class="options-container"></div>
</div>

<!-- 4. End Screen -->
<div id="end-screen" class="screen">
    <h2>प्रश्नोत्तरी समाप्त!</h2>
    <div class="meta-card" style="text-align: center;">
        <p>आपका कुल स्कोर</p>
        <div id="final-score" class="score-text">0 / 0</div>
    </div>
    <button class="btn" onclick="restartQuiz()">पुनः प्रयास करें</button>
</div>

<script>
    const quizData = [
        {
            question: "(क) तरबूज़ में लगभग कितने प्रतिशत पानी होता है?",
            options: [
                "50 प्रतिशत",
                "80 प्रतिशत",
                "92 प्रतिशत",
                "100 प्रतिशत"
            ],
            correct: 2
        },
        {
            question: "(ख) जापान के चौकोर तरबूज़ किस कारण विशेष माने जाते हैं?",
            options: [
                "उनके अनोखे आकार और सुंदरता के कारण",
                "उनके नीले रंग के कारण",
                "उनमें बीज न होने के कारण",
                "उनके बहुत छोटे होने के कारण"
            ],
            correct: 0
        },
        {
            question: "(ग) तरबूज़ के लाल भाग में कौन-सा लाभदायक तत्व पाया जाता है?",
            options: [
                "लाइकोपीन",
                "तारा",
                "साँचा",
                "काँच"
            ],
            correct: 0
        },
        {
            question: "(घ) दादाजी ने गोलू को वैज्ञानिक बनने के लिए क्यों प्रेरित किया?",
            options: [
                "क्योंकि वैज्ञानिक नई बातों को समझते हैं और उपयोगी खोज करते हैं।",
                "क्योंकि वैज्ञानिक केवल खेल-कूद करते हैं।",
                "क्योंकि वैज्ञानिक केवल पुस्तकें पढ़ते हैं।",
                "क्योंकि वैज्ञानिक महँगे फल खरीदते हैं।"
            ],
            correct: 0
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let timerVal = 45;
    let timerInterval = null;

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('intro-q-count').textContent = quizData.length;
        // Auto-transition from Logo Screen to Intro Screen after 5 seconds
        setTimeout(() => {
            switchScreen('intro-screen');
        }, 5000);
    });

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        switchScreen('game-screen');
        loadQuestion();
    }

    function loadQuestion() {
        timerVal = 45;
        document.getElementById('live-score').textContent = score;
        document.getElementById('q-idx').textContent = currentQuestionIndex + 1;
        document.getElementById('q-total').textContent = quizData.length;

        const currentQuiz = quizData[currentQuestionIndex];
        document.getElementById('question').innerText = currentQuiz.question;

        const optionsElement = document.getElementById('options');
        optionsElement.innerHTML = "";

        currentQuiz.options.forEach((option, index) => {
            const button = document.createElement("button");
            button.innerText = `${index + 1}. ${option}`;
            button.classList.add("option-btn");
            button.onclick = () => selectOption(index, button);
            optionsElement.appendChild(button);
        });

        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        document.getElementById('timer').textContent = timerVal;
        timerInterval = setInterval(() => {
            timerVal--;
            document.getElementById('timer').textContent = timerVal;
            if (timerVal <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 1000);
    }

    function selectOption(index, button) {
        clearInterval(timerInterval);
        const correctIndex = quizData[currentQuestionIndex].correct;
        const buttons = document.querySelectorAll(".option-btn");

        buttons.forEach(btn => btn.disabled = true);

        if (index === correctIndex) {
            button.classList.add("correct");
            score++;
            document.getElementById('live-score').textContent = score;
        } else {
            button.classList.add("incorrect");
            buttons[correctIndex].classList.add("correct");
        }

        setTimeout(nextQuestion, 1500);
    }

    function handleTimeout() {
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(btn => btn.disabled = true);
        const correctIndex = quizData[currentQuestionIndex].correct;
        buttons[correctIndex].classList.add("correct");

        setTimeout(nextQuestion, 1500);
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            endQuiz();
        }
    }

    function endQuiz() {
        clearInterval(timerInterval);
        document.getElementById('final-score').textContent = `${score} / ${quizData.length}`;
        switchScreen('end-screen');
    }

    function restartQuiz() {
        switchScreen('intro-screen');
    }
</script>

</body>
</html>
