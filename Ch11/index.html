<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पाठ 11: एक अनोखा तरबूज़ - Quiz</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --correct-color: #4caf50;
            --incorrect-color: #f44336;
            --border-color: #e9ecef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .screen {
            display: none;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            text-align: center;
        }

        .screen.active {
            display: block;
        }

        /* 1. Logo Screen */
        #logo-screen {
            display: none;
            min-height: 300px;
        }

        #logo-screen.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-logo {
            max-width: 280px;
            max-height: 160px;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        /* Meta Cards & Common UI */
        .meta-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
            border: 1px solid var(--border-color);
        }

        .meta-card p {
            margin: 8px 0;
            font-size: 1rem;
        }

        h1, h2 {
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: left;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-color);
            width: 100%;
        }

        .option-btn:hover:not([disabled]) {
            background-color: #e8f5e9;
            border-color: var(--primary-color);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: var(--correct-color) !important;
            color: #155724 !important;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: #f8d7da !important;
            border-color: var(--incorrect-color) !important;
            color: #721c24 !important;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 600;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .score-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 15px 0;
        }

        .timer-badge {
            background: #fee2e2;
            color: #dc2626;
            padding: 4px 10px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<!-- 1. Logo Screen -->
<div id="logo-screen" class="screen active">
    <img src="assets/logo.png" alt="Innovine Logo" class="app-logo">
</div>

<!-- 2. Intro Screen -->
<div id="intro-screen" class="screen">
    <h1>पाठ विवरण (Overview)</h1>
    <div class="meta-card">
        <p><strong>विषय (Subject):</strong> हिंदी</p>
        <p><strong>पाठ (Topic):</strong> पाठ 11: एक अनोखा तरबूज़ (CBQ)</p>
        <p><strong>कुल प्रश्न (Total Questions):</strong> <span id="intro-q-count">0</span></p>
    </div>
    <button class="btn" onclick="startQuiz()">प्रश्नोत्तरी शुरू करें</button>
</div>

<!-- 3. Game Area Screen -->
<div id="game-screen" class="screen">
    <div class="game-header">
        <span>अंक: <span id="live-score">0</span></span>
        <span class="timer-badge">⏱️ <span id="timer">45</span>s</span>
        <span>प्रश्न: <span id="q-idx">1</span>/<span id="q-total">0</span></span>
    </div>

    <div id="question" class="question-text"></div>
    <div id="options" class="options-container"></div>
</div>

<!-- 4. End Screen -->
<div id="end-screen" class="screen">
    <h2>प्रश्नोत्तरी समाप्त!</h2>
    <div class="meta-card" style="text-align: center;">
        <p>आपका कुल स्कोर</p>
        <div id="final-score" class="score-text">0 / 0</div>
    </div>
    <button class="btn" onclick="restartQuiz()">पुनः प्रयास करें</button>
</div>

<script>
    const quizData = [
        {
            question: "1. गोलू को तरबूज संभालने में सबसे बड़ी समस्या क्या थी?",
            options: [
                "वह बहुत छोटा था",
                "वह लगातार अपनी स्थिति बदल रहा था",
                "वह रंग बदल रहा था",
                "वह टूट गया था"
            ],
            correct: 1
        },
        {
            question: "2. दादाजी के अनुसार प्रकृति ने फलों को गोल क्यों बनाया होगा?",
            options: [
                "सजावट के लिए",
                "आसानी से बढ़ने और फैलने के लिए",
                "स्वाद बढ़ाने के लिए",
                "वजन कम करने के लिए"
            ],
            correct: 1
        },
        {
            question: "3. यदि किसी वस्तु को सीमित स्थान में फिट करना हो, तो सबसे महत्वपूर्ण बात क्या होगी?",
            options: [
                "उसका रंग",
                "उसका आकार",
                "उसका स्वाद",
                "उसकी उम्र"
            ],
            correct: 1
        },
        {
            question: "4. किसान फल के विकास को नियंत्रित कर रहे हैं — यह किसका उदाहरण है?",
            options: [
                "कल्पना",
                "वैज्ञानिक प्रयोग",
                "खेल",
                "परंपरा"
            ],
            correct: 1
        },
        {
            question: "5. साँचे (mold) में फल रखने का सबसे सही परिणाम क्या होता है?",
            options: [
                "फल का स्वाद बदल जाता है",
                "फल का आकार बदल जाता है",
                "फल सूख जाता है",
                "फल रंग बदलता है"
            ],
            correct: 1
        },
        {
            question: "6. यदि परिवहन में जगह बचानी हो, तो कौन-सी रणनीति बेहतर है?",
            options: [
                "वस्तुओं को अलग-अलग रखना",
                "उन्हें व्यवस्थित ढंग से पैक करना",
                "उन्हें फेंक देना",
                "आकार बढ़ाना"
            ],
            correct: 1
        },
        {
            question: "7. दादाजी की बातों से गोलू ने क्या सबसे महत्वपूर्ण सीख ली?",
            options: [
                "फल केवल खाने के लिए हैं",
                "विज्ञान जीवन को बेहतर बनाता है",
                "फ्रिज जरूरी है",
                "तरबूज महंगा है"
            ],
            correct: 1
        },
        {
            question: "8. जापान में तरबूज को उपहार के रूप में देने का कारण क्या हो सकता है?",
            options: [
                "वह सस्ता है",
                "वह अनोखा और विशेष है",
                "वह छोटा है",
                "वह कड़वा है"
            ],
            correct: 1
        },
        {
            question: "9. भविष्य में अंतरिक्ष खेती (space farming) क्यों जरूरी होगी?",
            options: [
                "पृथ्वी खत्म होने के लिए",
                "सीमित जगह में भोजन उत्पादन के लिए",
                "खेल के लिए",
                "व्यापार के लिए"
            ],
            correct: 1
        },
        {
            question: "10. गोलू का सबसे सही स्वभाव क्या दिखता है?",
            options: [
                "आलसी",
                "जिज्ञासु",
                "गुस्सैल",
                "डरपोक"
            ],
            correct: 1
        },
        {
            question: "11. मंगल ग्रह पर खेती करने की जरूरत क्यों पड़ सकती है?",
            options: [
                "वहां पेड़ बहुत हैं",
                "वहां संसाधन सीमित हैं",
                "वहां पानी ज्यादा है",
                "वहां मिट्टी नहीं है"
            ],
            correct: 1
        },
        {
            question: "12. तरबूज के बीज क्यों उपयोगी हैं?",
            options: [
                "वे जहरीले हैं",
                "वे प्रोटीन से भरपूर हैं",
                "वे रंग बदलते हैं",
                "वे मीठे होते हैं"
            ],
            correct: 1
        },
        {
            question: "13. किसान तकनीक का उपयोग क्यों करते हैं?",
            options: [
                "परंपरा निभाने के लिए",
                "बेहतर उत्पादन और उपयोग के लिए",
                "खेल के लिए",
                "सजावट के लिए"
            ],
            correct: 1
        },
        {
            question: "14. गोलू के सवालों से क्या पता चलता है?",
            options: [
                "वह खेलना पसंद करता है",
                "वह सोचता और समझना चाहता है",
                "वह डरता है",
                "वह सोता है"
            ],
            correct: 1
        },
        {
            question: "15. इस पाठ का सबसे गहरा संदेश क्या है?",
            options: [
                "फल महंगे होते हैं",
                "विज्ञान सोच बदलता है",
                "तरबूज खास है",
                "फ्रिज जरूरी है"
            ],
            correct: 1
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let timerVal = 45;
    let timerInterval = null;

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('intro-q-count').textContent = quizData.length;
        // Auto-transition from Logo Screen to Intro Screen after 5 seconds
        setTimeout(() => {
            switchScreen('intro-screen');
        }, 5000);
    });

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        switchScreen('game-screen');
        loadQuestion();
    }

    function loadQuestion() {
        timerVal = 45;
        document.getElementById('live-score').textContent = score;
        document.getElementById('q-idx').textContent = currentQuestionIndex + 1;
        document.getElementById('q-total').textContent = quizData.length;

        const currentQuiz = quizData[currentQuestionIndex];
        document.getElementById('question').innerText = currentQuiz.question;

        const optionsElement = document.getElementById('options');
        optionsElement.innerHTML = "";

        currentQuiz.options.forEach((option, index) => {
            const button = document.createElement("button");
            button.innerText = `${String.fromCharCode(2453 + index)}) ${option}`; // क, ख, ग, घ
            button.classList.add("option-btn");
            button.onclick = () => selectOption(index, button);
            optionsElement.appendChild(button);
        });

        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        document.getElementById('timer').textContent = timerVal;
        timerInterval = setInterval(() => {
            timerVal--;
            document.getElementById('timer').textContent = timerVal;
            if (timerVal <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 1000);
    }

    function selectOption(index, button) {
        clearInterval(timerInterval);
        const correctIndex = quizData[currentQuestionIndex].correct;
        const buttons = document.querySelectorAll(".option-btn");

        buttons.forEach(btn => btn.disabled = true);

        if (index === correctIndex) {
            button.classList.add("correct");
            score++;
            document.getElementById('live-score').textContent = score;
        } else {
            button.classList.add("incorrect");
            buttons[correctIndex].classList.add("correct");
        }

        setTimeout(nextQuestion, 1500);
    }

    function handleTimeout() {
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(btn => btn.disabled = true);
        const correctIndex = quizData[currentQuestionIndex].correct;
        buttons[correctIndex].classList.add("correct");

        setTimeout(nextQuestion, 1500);
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            endQuiz();
        }
    }

    function endQuiz() {
        clearInterval(timerInterval);
        document.getElementById('final-score').textContent = `${score} / ${quizData.length}`;
        switchScreen('end-screen');
    }

    function restartQuiz() {
        switchScreen('intro-screen');
    }
</script>

</body>
</html>
