
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पाठ 11: एक अनोखा तरबूज़ - Quiz</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --correct-color: #4caf50;
            --incorrect-color: #f44336;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .question-card {
            margin-bottom: 25px;
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-color);
        }

        .option-btn:hover:not([disabled]) {
            background-color: #e8f5e9;
            border-color: var(--primary-color);
        }

        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: var(--correct-color) !important;
            color: #155724;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: #f8d7da !important;
            border-color: var(--incorrect-color) !important;
            color: #721c24;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e9ecef;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .score-container {
            text-align: center;
            padding: 20px 0;
        }

        .score-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .hide {
            display: none;
        }

        .progress {
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>पाठ 11: एक अनोखा तरबूज़ (Quiz)</h1>

    <div id="quiz-box">
        <div class="question-card">
            <div id="question" class="question-text">प्रश्न यहाँ दिखेगा</div>
            <div id="options" class="options-container"></div>
        </div>

        <div class="navigation">
            <span id="progress" class="progress">प्रश्न 1 / 4</span>
            <button id="next-btn" class="btn" onclick="nextQuestion()" disabled>अगला प्रश्न</button>
        </div>
    </div>

    <div id="score-box" class="score-container hide">
        <h2>प्रश्नोत्तरी समाप्त!</h2>
        <div id="score" class="score-text">आपका स्कोर: 0 / 4</div>
        <button class="btn" onclick="restartQuiz()">पुनः प्रयास करें</button>
    </div>
</div>

<script>
    const quizData = [
        {
            question: "(क) तरबूज़ में लगभग कितने प्रतिशत पानी होता है?",
            options: [
                "50 प्रतिशत",
                "80 प्रतिशत",
                "92 प्रतिशत",
                "100 प्रतिशत"
            ],
            correct: 2
        },
        {
            question: "(ख) जापान के चौकोर तरबूज़ किस कारण विशेष माने जाते हैं?",
            options: [
                "उनके अनोखे आकार और सुंदरता के कारण",
                "उनके नीले रंग के कारण",
                "उनमें बीज न होने के कारण",
                "उनके बहुत छोटे होने के कारण"
            ],
            correct: 0
        },
        {
            question: "(ग) तरबूज़ के लाल भाग में कौन-सा लाभदायक तत्व पाया जाता है?",
            options: [
                "लाइकोपीन",
                "तारा",
                "साँचा",
                "काँच"
            ],
            correct: 0
        },
        {
            question: "(घ) दादाजी ने गोलू को वैज्ञानिक बनने के लिए क्यों प्रेरित किया?",
            options: [
                "क्योंकि वैज्ञानिक नई बातों को समझते हैं और उपयोगी खोज करते हैं।",
                "क्योंकि वैज्ञानिक केवल खेल-कूद करते हैं।",
                "क्योंकि वैज्ञानिक केवल पुस्तकें पढ़ते हैं।",
                "क्योंकि वैज्ञानिक महँगे फल खरीदते हैं।"
            ],
            correct: 0
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let selectedOption = null;

    const questionElement = document.getElementById("question");
    const optionsElement = document.getElementById("options");
    const nextButton = document.getElementById("next-btn");
    const progressElement = document.getElementById("progress");
    const quizBox = document.getElementById("quiz-box");
    const scoreBox = document.getElementById("score-box");
    const scoreElement = document.getElementById("score");

    function loadQuestion() {
        selectedOption = null;
        nextButton.disabled = true;
        
        const currentQuiz = quizData[currentQuestionIndex];
        questionElement.innerText = currentQuiz.question;
        progressElement.innerText = `प्रश्न ${currentQuestionIndex + 1} / ${quizData.length}`;
        
        optionsElement.innerHTML = "";
        currentQuiz.options.forEach((option, index) => {
            const button = document.createElement("button");
            button.innerText = option;
            button.classList.add("option-btn");
            button.onclick = () => selectOption(index, button);
            optionsElement.appendChild(button);
        });

        if (currentQuestionIndex === quizData.length - 1) {
            nextButton.innerText = "परिणाम देखें";
        } else {
            nextButton.innerText = "अगला प्रश्न";
        }
    }

    function selectOption(index, button) {
        if (selectedOption !== null) return;
        
        selectedOption = index;
        const correctIndex = quizData[currentQuestionIndex].correct;
        const buttons = optionsElement.querySelectorAll(".option-btn");

        buttons.forEach((btn, i) => {
            btn.disabled = true;
            if (i === correctIndex) {
                btn.classList.add("correct");
            }
        });

        if (index === correctIndex) {
            score++;
        } else {
            button.classList.add("incorrect");
        }

        nextButton.disabled = false;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    }

    function showScore() {
        quizBox.classList.add("hide");
        scoreBox.classList.remove("hide");
        scoreElement.innerText = `आपका स्कोर: ${score} / ${quizData.length}`;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        scoreBox.classList.add("hide");
        quizBox.classList.remove("hide");
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
