<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>एआई का कमाल - CBQ Quiz Application</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #d97706;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --border: #cbd5e1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  
  .screen { display: none; width: 100%; max-width: 650px; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
  .screen.active { display: block; }

  /* 1. Centered Single Logo Screen */
  #logo-screen { 
    display: none; 
    min-height: 300px;
  }
  #logo-screen.active {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app-logo {
    max-width: 280px;
    max-height: 160px;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }

  /* Intro & End Screen */
  .meta-card { background: #f1f5f9; padding: 15px; border-radius: 8px; margin: 20px 0; text-align: left; }
  .meta-card p { margin: 8px 0; font-size: 1rem; }
  button.btn-action { background: var(--primary); color: white; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: 600; }
  button.btn-action:hover { background: var(--primary-hover); }

  /* Game Area */
  .game-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 20px; font-weight: bold; }
  .timer-badge { background: #fee2e2; color: var(--danger); padding: 6px 12px; border-radius: 20px; font-size: 0.9rem; }
  .scenario-text { text-align: left; font-size: 1.1rem; line-height: 1.5; margin-bottom: 20px; font-weight: 600; }
  
  .options-grid { display: grid; gap: 12px; margin-bottom: 20px; }
  .btn-option { background: #ffffff; border: 2px solid var(--border); padding: 14px; border-radius: 8px; font-size: 1rem; text-align: left; cursor: pointer; transition: 0.2s; color: var(--text); }
  .btn-option:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
  .btn-option:disabled { cursor: not-allowed; }
  .btn-option.correct { background: #dcfce7; border-color: var(--success); color: #14532d; font-weight: bold; }
  .btn-option.incorrect { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; }

  .competency-tag { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; margin-bottom: 10px; font-weight: bold; }
  .hint-box { background: #fef3c7; border: 1px solid #fde68a; color: #92400e; display: none; border-radius: 6px; padding: 12px; margin-top: 15px; text-align: left; font-size: 0.95rem; }

  .footer-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .btn-secondary { background: #e2e8f0; color: var(--text); border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .btn-secondary:hover { background: #cbd5e1; }
  .score-display { font-size: 2.5rem; font-weight: bold; color: var(--primary); margin: 15px 0; }
</style>
</head>
<body>

  <!-- 1. Logo Screen -->
  <div id="logo-screen" class="screen active">
    <img src="assets/logo.png" alt="Innovine Logo" class="app-logo">
  </div>

  <!-- 2. Intro Screen -->
  <div id="intro-screen" class="screen">
    <h1 style="color: var(--primary); margin-bottom: 10px;">क्विज़ विवरण (Overview)</h1>
    <div class="meta-card">
      <p><strong>विषय (Subject):</strong> हिंदी / तकनीक (Hindi / Technology)</p>
      <p><strong>शीर्षक (Topic):</strong> एआई का कमाल</p>
      <p><strong>कुल प्रश्न (Total Questions):</strong> <span id="total-q-count">0</span></p>
      <p><strong>समय सीमा (Time Limit):</strong> 45 सेकंड प्रति प्रश्न</p>
    </div>
    <button class="btn-action" onclick="startQuiz()">क्विज़ शुरू करें</button>
  </div>

  <!-- 3. Game Area Screen -->
  <div id="game-screen" class="screen">
    <div class="game-header">
      <span>अंक: <span id="current-score">0</span></span>
      <span class="timer-badge">⏱️ <span id="timer">45</span>s</span>
      <span>प्रश्न: <span id="question-number">1</span>/<span id="total-questions">0</span></span>
    </div>

    <div style="text-align: left;">
      <span class="competency-tag" id="competencyTag">Competency</span>
    </div>
    <div class="scenario-text" id="scenarioText">प्रश्न यहाँ दिखाई देगा</div>
    <div class="options-grid" id="optionsContainer"></div>

    <div class="hint-box" id="hintBox"></div>

    <div class="footer-controls">
      <button class="btn-secondary" id="hintBtn" onclick="toggleHint()">संकेत (Hint)</button>
      <button class="btn-action" id="nextBtn" onclick="nextQuestion()" style="display: none;">अगला प्रश्न</button>
    </div>
  </div>

  <!-- 4. End Screen -->
  <div id="end-screen" class="screen">
    <h1 style="color: var(--primary);">क्विज़ समाप्त!</h1>
    <div class="meta-card" style="text-align: center;">
      <p>आपका कुल स्कोर</p>
      <div class="score-display" id="finalScore">0 / 0</div>
    </div>
    <button class="btn-action" onclick="restartQuiz()">पुनः प्रयास करें</button>
  </div>

  <script>
    const originalQuestions = [

      },

        options: [
          "एआई सारे काम मनुष्यों की जगह कर देगी।",

        answerText: "मनुष्य सोच-विचार करे और एआई सहायता करे।",

      },
      {
        scenario: "यदि विद्यालय में एआई रोबोट बच्चों की सहायता करता है, तो वह किस काम में मदद कर सकता है?",
        options: [

      {
        scenario: "“मशीनें अब सोचती हैं, जैसे कोई इंसान है” पंक्ति का भाव क्या है?",
        options: [

          "मशीनें कुछ कार्यों को समझने और पूरा करने में सक्षम हैं।",
          "मशीनें इंसानों से बेहतर होती हैं।",
          "मशीनें इंसानों की जगह ले लेंगी।"
        ],
        answerText: "मशीनें कुछ कार्यों को समझने और पूरा करने में सक्षम हैं।",
        competency: "भाव और अर्थ को समझना",
        hint: "यह पंक्ति एआई द्वारा डेटा का विश्लेषण करके स्मार्ट निर्णय लेने की क्षमता को दर्शाती है।"
      },
      {
        scenario: "एआई का उपयोग करते समय हमें किस बात का ध्यान रखना चाहिए?",
        options: [
          "हर जानकारी को बिना जाँच के स्वीकार करना चाहिए।",
          "एआई का उपयोग जिम्मेदारी और समझदारी से करना चाहिए।",
          "केवल मनोरंजन के लिए उपयोग करना चाहिए।",
          "अपनी सोच का उपयोग नहीं करना चाहिए।"
        ],
        answerText: "एआई का उपयोग जिम्मेदारी और समझदारी से करना चाहिए।",
        competency: "जिम्मेदार डिजिटल व्यवहार",
        hint: "तकनीक का नैतिक और विवेकपूर्ण उपयोग ही हमें सही दिशा में ले जाता है।"
      },
      {
        scenario: "एआई और मनुष्य में सबसे बड़ा अंतर क्या है?",
        options: [
          "एआई डेटा के आधार पर काम करती है, जबकि मनुष्य सोच-विचार और भावनाओं से निर्णय लेते हैं।",
          "एआई कभी कोई काम नहीं कर सकती।",
          "मनुष्य कोई नया विचार नहीं बना सकते।",
          "दोनों बिल्कुल एक जैसे हैं।"
        ],
        answerText: "एआई डेटा के आधार पर काम करती है, जबकि मनुष्य सोच-विचार और भावनाओं से निर्णय लेते हैं।",
        competency: "तुलना और विश्लेषण करना",
        hint: "एआई के पास केवल डेटा और एल्गोरिदम हैं, जबकि मनुष्य के पास चेतना और भावनाएं हैं।"
      },
      {
        scenario: "यदि आपको एआई रोबोट बनाने का अवसर मिले, तो आप उसे किस काम के लिए उपयोग करना चाहेंगे?",
        options: [
          "लोगों की सहायता और सीखने को आसान बनाने के लिए।",
          "लोगों को काम करने से रोकने के लिए।",
          "गलत जानकारी फैलाने के लिए।",
          "केवल समय बर्बाद करने के लिए।"
        ],
        answerText: "लोगों की सहायता और सीखने को आसान बनाने के लिए।",
        competency: "रचनात्मक सोच का प्रयोग",
        hint: "तकनीक का निर्माण समाज के कल्याण और बेहतरी के लिए होना चाहिए।"
      },
      {
        scenario: "“एआई का कमाल” कविता का मुख्य संदेश क्या है?",
        options: [
          "एआई मनुष्यों की जगह ले लेगी।",
          "एआई एक उपयोगी साथी है, जिसका प्रयोग सोच-समझकर करना चाहिए।",
          "मशीनों का उपयोग नहीं करना चाहिए।",
          "केवल मशीनों पर निर्भर रहना चाहिए।"
        ],
        answerText: "एआई एक उपयोगी साथी है, जिसका प्रयोग सोच-समझकर करना चाहिए।",
        competency: "मुख्य विचार का मूल्यांकन करना",
        hint: "कविता तकनीक को एक सहायक के रूप में देखने की सलाह देती है।"
      }
    ];

    let quizQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let timerVal = 45;
    let timerInterval = null;

    // Shuffle Array Function (Fisher-Yates)
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Prepare Randomized Quiz Data
    function prepareQuizData() {
      // 1. Shuffle questions order
      let shuffledData = shuffleArray(JSON.parse(JSON.stringify(originalQuestions)));

      // 2. Shuffle options inside each question & recalculate correct answer index
      shuffledData.forEach(item => {
        item.options = shuffleArray(item.options);
        item.answer = item.options.indexOf(item.answerText);
      });

      return shuffledData;
    }

    // Window load handler for splash screen
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('total-q-count').textContent = originalQuestions.length;
      document.getElementById('total-questions').textContent = originalQuestions.length;
      
      // Transition from Logo Screen to Intro Screen after 5 seconds
      setTimeout(() => {
        switchScreen('intro-screen');
      }, 5000);
    });

    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function startQuiz() {
      quizQuestions = prepareQuizData(); // Generate randomized set
      currentQuestionIndex = 0;
      score = 0;
      switchScreen('game-screen');
      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(timerInterval);
      timerVal = 45;
      
      const q = quizQuestions[currentQuestionIndex];
      document.getElementById('question-number').textContent = currentQuestionIndex + 1;
      document.getElementById('current-score').textContent = score;
      document.getElementById('scenarioText').textContent = q.scenario;
      document.getElementById('competencyTag').textContent = `Competency: ${q.competency}`;
      
      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';
      
      const hintBox = document.getElementById('hintBox');
      hintBox.style.display = 'none';
      hintBox.textContent = `संकेत: ${q.hint}`;
      
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('hintBtn').style.display = 'inline-block';

      const hindiLetters = ['क', 'ख', 'ग', 'घ'];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.textContent = `${hindiLetters[idx]}) ${opt}`;
        btn.onclick = () => selectAnswer(idx);
        optionsContainer.appendChild(btn);
      });

      startTimer();
    }

    function startTimer() {
      document.getElementById('timer').textContent = timerVal;
      timerInterval = setInterval(() => {
        timerVal--;
        document.getElementById('timer').textContent = timerVal;
        if (timerVal <= 0) {
          clearInterval(timerInterval);
          handleTimeout();
        }
      }, 1000);
    }

    function selectAnswer(selectedIndex) {
      clearInterval(timerInterval);
      const q = quizQuestions[currentQuestionIndex];
      const buttons = document.querySelectorAll('.btn-option');

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.answer) {
          btn.classList.add('correct');
        }
      });

      if (selectedIndex === q.answer) {
        score++;
        document.getElementById('current-score').textContent = score;
      } else {
        buttons[selectedIndex].classList.add('incorrect');
      }

      document.getElementById('nextBtn').style.display = 'inline-block';
    }

    function handleTimeout() {
      const q = quizQuestions[currentQuestionIndex];
      const buttons = document.querySelectorAll('.btn-option');
      
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.answer) {
          btn.classList.add('correct');
        }
      });

      document.getElementById('nextBtn').style.display = 'inline-block';
    }

    function toggleHint() {
      const hintBox = document.getElementById('hintBox');
      if (hintBox.style.display === 'none' || hintBox.style.display === '') {
        hintBox.style.display = 'block';
      } else {
        hintBox.style.display = 'none';
      }
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizQuestions.length) {
        loadQuestion();
      } else {
        endQuiz();
      }
    }

    function endQuiz() {
      clearInterval(timerInterval);
      document.getElementById('finalScore').textContent = `${score} / ${quizQuestions.length}`;
      switchScreen('end-screen');
    }

    function restartQuiz() {
      switchScreen('intro-screen');
    }
  </script>
</body>
</html>
