<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>तरबूज़ एवं विज्ञान - CBQ Quiz Application</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #d97706;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --border: #cbd5e1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  
  .screen { display: none; width: 100%; max-width: 650px; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
  .screen.active { display: block; }

  /* 1. Centered Single Logo Screen */
  #logo-screen { 
    display: none; 
    min-height: 300px;
  }
  #logo-screen.active {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app-logo {
    max-width: 280px;
    max-height: 160px;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }

  /* Intro & End Screen */
  .meta-card { background: #f1f5f9; padding: 15px; border-radius: 8px; margin: 20px 0; text-align: left; }
  .meta-card p { margin: 8px 0; font-size: 1rem; }
  button.btn-action { background: var(--primary); color: white; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: 600; }
  button.btn-action:hover { background: var(--primary-hover); }

  /* Game Area */
  .game-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 20px; font-weight: bold; }
  .timer-badge { background: #fee2e2; color: var(--danger); padding: 6px 12px; border-radius: 20px; font-size: 0.9rem; }
  .scenario-text { text-align: left; font-size: 1.1rem; line-height: 1.5; margin-bottom: 20px; font-weight: 600; }
  
  .options-grid { display: grid; gap: 12px; margin-bottom: 20px; }
  .btn-option { background: #ffffff; border: 2px solid var(--border); padding: 14px; border-radius: 8px; font-size: 1rem; text-align: left; cursor: pointer; transition: 0.2s; color: var(--text); }
  .btn-option:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
  .btn-option:disabled { cursor: not-allowed; }
  .btn-option.correct { background: #dcfce7; border-color: var(--success); color: #14532d; font-weight: bold; }
  .btn-option.incorrect { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; }

  .feedback-box, .hint-box { border-radius: 6px; padding: 12px; margin-top: 15px; text-align: left; font-size: 0.95rem; }
  .feedback-box { background: #e0f2fe; border: 1px solid #bae6fd; color: #0369a1; display: none; }
  .hint-box { background: #fef3c7; border: 1px solid #fde68a; color: #92400e; display: none; }

  .footer-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .btn-secondary { background: #e2e8f0; color: var(--text); border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .btn-secondary:hover { background: #cbd5e1; }
  .score-display { font-size: 2.5rem; font-weight: bold; color: var(--primary); margin: 15px 0; }
</style>
</head>
<body>

  <!-- 1. Logo Screen -->
  <div id="logo-screen" class="screen active">
    <img src="assets/logo.png" alt="Innovine Logo" class="app-logo">
  </div>

  <!-- 2. Intro Screen -->
  <div id="intro-screen" class="screen">
    <h1 style="color: var(--primary); margin-bottom: 10px;">क्विज़ विवरण (Overview)</h1>
    <div class="meta-card">
      <p><strong>विषय (Subject):</strong> हिंदी / विज्ञान (Hindi / Science)</p>
      <p><strong>शीर्षक (Topic):</strong> तरबूज़ एवं विज्ञान</p>
      <p><strong>कुल प्रश्न (Total Questions):</strong> <span id="total-q-count">0</span></p>
      <p><strong>समय सीमा (Time Limit):</strong> 45 सेकंड प्रति प्रश्न</p>
    </div>
    <button class="btn-action" onclick="startQuiz()">क्विज़ शुरू करें</button>
  </div>

  <!-- 3. Game Area Screen -->
  <div id="game-screen" class="screen">
    <div class="game-header">
      <span>अंक: <span id="current-score">0</span></span>
      <span class="timer-badge">⏱️ <span id="timer">45</span>s</span>
      <span>प्रश्न: <span id="question-number">1</span>/<span id="total-questions">0</span></span>
    </div>

    <div class="scenario-text" id="scenarioText">प्रश्न यहाँ दिखाई देगा</div>
    <div class="options-grid" id="optionsContainer"></div>

    <div class="hint-box" id="hintBox"></div>
    <div class="feedback-box" id="feedbackBox"></div>

    <div class="footer-controls">
      <button class="btn-secondary" id="hintBtn" onclick="toggleHint()">संकेत (Hint)</button>
      <button class="btn-action" id="nextBtn" onclick="nextQuestion()" style="display: none;">अगला प्रश्न</button>
    </div>
  </div>

  <!-- 4. End Screen -->
  <div id="end-screen" class="screen">
    <h1 style="color: var(--primary);">क्विज़ समाप्त!</h1>
    <div class="meta-card" style="text-align: center;">
      <p>आपका कुल स्कोर</p>
      <div class="score-display" id="finalScore">0 / 0</div>
    </div>
    <button class="btn-action" onclick="restartQuiz()">पुनः प्रयास करें</button>
  </div>

  <script>
    const quizQuestions = [
      {
        scenario: "(क) तरबूज़ में लगभग कितने प्रतिशत पानी होता है?",
        options: ["50 प्रतिशत", "80 प्रतिशत", "92 प्रतिशत", "100 प्रतिशत"],
        answer: 2,
        hint: "यह 90% से अधिक होता है और शरीर को हाइड्रेटेड रखने में मदद करता है।"
      },
      {
        scenario: "(ख) जापान के चौकोर तरबूज़ किस कारण विशेष माने जाते हैं?",
        options: [
          "उनके अनोखे आकार और सुंदरता के कारण",
          "उनके नीले रंग के कारण",
          "उनमें बीज न होने के कारण",
          "उनके बहुत छोटे होने के कारण"
        ],
        answer: 0,
        hint: "उन्हें खास साँचे में उगाया जाता है जिससे उनका रूप आकर्षक दिखता है।"
      },
      {
        scenario: "(ग) तरबूज़ के लाल भाग में कौन-सा लाभदायक तत्व पाया जाता है?",
        options: ["लाइकोपीन", "तारा", "साँचा", "काँच"],
        answer: 0,
        hint: "यह एक शक्तिशाली एंटी-ऑक्सीडेंट है जो फल को लाल रंग भी देता है।"
      },
      {
        scenario: "(घ) दादाजी ने गोलू को वैज्ञानिक बनने के लिए क्यों प्रेरित किया?",
        options: [
          "क्योंकि वैज्ञानिक नई बातों को समझते हैं और उपयोगी खोज करते हैं।",
          "क्योंकि वैज्ञानिक केवल खेल-कूद करते हैं।",
          "क्योंकि वैज्ञानिक केवल पुस्तकें पढ़ते हैं।",
          "क्योंकि वैज्ञानिक महँगे फल खरीदते हैं।"
        ],
        answer: 0,
        hint: "वैज्ञानिक नई तकनीकों और प्रयोगों से समाज का भला करते हैं।"
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let timerVal = 45;
    let timerInterval = null;

    // Window load handler for splash screen
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('total-q-count').textContent = quizQuestions.length;
      document.getElementById('total-questions').textContent = quizQuestions.length;
      
      // Auto-transition from Logo Screen to Intro Screen after 5 seconds
      setTimeout(() => {
        switchScreen('intro-screen');
      }, 5000);
    });

    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function startQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      switchScreen('game-screen');
      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(timerInterval);
      timerVal = 45;
      
      const q = quizQuestions[currentQuestionIndex];
      document.getElementById('question-number').textContent = currentQuestionIndex + 1;
      document.getElementById('current-score').textContent = score;
      document.getElementById('scenarioText').textContent = q.scenario;
      
      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';
      
      const hintBox = document.getElementById('hintBox');
      const feedbackBox = document.getElementById('feedbackBox');
      hintBox.style.display = 'none';
      feedbackBox.style.display = 'none';
      hintBox.textContent = `संकेत: ${q.hint}`;
      
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('hintBtn').style.display = 'inline-block';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.textContent = `${idx + 1}. ${opt}`;
        btn.onclick = () => selectAnswer(idx);
        optionsContainer.appendChild(btn);
      });

      startTimer();
    }

    function startTimer() {
      document.getElementById('timer').textContent = timerVal;
      timerInterval = setInterval(() => {
        timerVal--;
        document.getElementById('timer').textContent = timerVal;
        if (timerVal <= 0) {
          clearInterval(timerInterval);
          handleTimeout();
        }
      }, 1000);
    }

    function selectAnswer(selectedIndex) {
      clearInterval(timerInterval);
      const q = quizQuestions[currentQuestionIndex];
      const buttons = document.querySelectorAll('.btn-option');

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.answer) {
          btn.classList.add('correct');
        }
      });

      if (selectedIndex === q.answer) {
        score++;
        document.getElementById('current-score').textContent = score;
      } else {
        buttons[selectedIndex].classList.add('incorrect');
      }

      document.getElementById('nextBtn').style.display = 'inline-block';
    }

    function handleTimeout() {
      const q = quizQuestions[currentQuestionIndex];
      const buttons = document.querySelectorAll('.btn-option');
      
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.answer) {
          btn.classList.add('correct');
        }
      });

      document.getElementById('nextBtn').style.display = 'inline-block';
    }

    function toggleHint() {
      const hintBox = document.getElementById('hintBox');
      if (hintBox.style.display === 'none' || hintBox.style.display === '') {
        hintBox.style.display = 'block';
      } else {
        hintBox.style.display = 'none';
      }
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizQuestions.length) {
        loadQuestion();
      } else {
        endQuiz();
      }
    }

    function endQuiz() {
      clearInterval(timerInterval);
      document.getElementById('finalScore').textContent = `${score} / ${quizQuestions.length}`;
      switchScreen('end-screen');
    }

    function restartQuiz() {
      switchScreen('intro-screen');
    }
  </script>
</body>
</html>
