<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>तेनालीराम की चतुराई - क्विज़</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --warning-bg: #fef3c8;
      --warning-border: #fde68a;
      --warning-text: #92400e;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.08), 0 8px 10px -6px rgba(0,0,0,0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 32px 24px;
      position: relative;
    }

    .screen.active {
      display: block;
    }

    /* Logo Screen Styling */
    #logo-screen {
      display: none;
      min-height: 300px;
      text-align: center;
    }

    #logo-screen.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-logo {
      max-width: 280px;
      max-height: 160px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    /* Meta / Overview Screen */
    .meta-card {
      background: #f1f5f9;
      padding: 16px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: left;
    }

    .meta-card p {
      margin: 8px 0;
      font-size: 15px;
      color: var(--text);
    }

    /* Quiz Header */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
    }

    .question {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.5;
      margin-bottom: 24px;
      text-align: left;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .option-btn:hover:not([disabled]) {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: var(--success-bg) !important;
      border-color: var(--success) !important;
      color: #14532d !important;
      font-weight: 700;
    }

    .option-btn.wrong {
      background-color: var(--danger-bg) !important;
      border-color: var(--danger) !important;
      color: #7f1d1d !important;
      opacity: 0.8;
    }

    .hint-box {
      margin-top: 16px;
      padding: 14px 16px;
      background-color: var(--warning-bg);
      border: 1px solid var(--warning-border);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--warning-text);
      line-height: 1.4;
      display: none;
      text-align: left;
    }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      gap: 12px;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .score-screen {
      text-align: center;
      padding: 12px 0;
    }

    .score-screen h2 {
      font-size: 26px;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .score-screen p {
      font-size: 18px;
      margin-bottom: 24px;
      color: var(--text);
    }
  </style>
</head>

    </div>
  </div>

    <div class="hint-box" id="hintBox" aria-live="polite"></div>

    <div class="footer-actions">
      <button class="btn btn-secondary" id="hintBtn" onclick="toggleHint()">संकेत (Hint)</button>
      <button class="btn" id="nextBtn" onclick="nextQuestion()" style="display: none;">अगला प्रश्न</button>
    </div>
  </div>

    // एरे को रैंडम करने का फ़ंक्शन (Fisher-Yates Shuffle Algorithm)
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // प्रश्नों और उनके विकल्पों दोनों को रैंडम बनाना
    function prepareRandomQuizData() {
      // 1. प्रश्नों का क्रम बदलें
      const shuffledQuestions = shuffleArray(originalQuizQuestions);

      // 2. हर प्रश्न के विकल्पों को रैंडम करें और सही उत्तर सूचकांक (answer index) को अपडेट करें
      return shuffledQuestions.map(q => {
        const correctAnswerText = q.options[q.answer];
        const shuffledOptions = shuffleArray(q.options);
        const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);

        return {
          ...q,
          options: shuffledOptions,
          answer: newCorrectIndex
        };
      });
    }

    }

    function startQuiz() {
      newQuizQuestions = prepareRandomQuizData(); // हर बार नए सिरे से रैंडमाइज करें
      currentQuestionIndex = 0;
      score = 0;
      switchScreen('game-screen');
      loadQuestion();
    }

    function loadQuestion() {
      const currentQ = newQuizQuestions[currentQuestionIndex];
      questionText.textContent = `${currentQuestionIndex + 1}. ${currentQ.scenario}`;
      progress.textContent = `प्रश्न ${currentQuestionIndex + 1} / ${newQuizQuestions.length}`;
      scoreTracker.textContent = `अंक: ${score}`;
      
      optionsContainer.innerHTML = '';
      hintBox.style.display = 'none';
      hintBox.textContent = `संकेत: ${currentQ.hint}`;
      nextBtn.style.display = 'none';
      hintBtn.style.display = 'inline-block';

      currentQ.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => selectAnswer(idx);
        optionsContainer.appendChild(btn);
      });
    }

    function selectAnswer(selectedIndex) {
      const currentQ = newQuizQuestions[currentQuestionIndex];
      const buttons = optionsContainer.children;

      for (let i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
        if (i === currentQ.answer) {
          buttons[i].classList.add('correct');
        }
      }

      if (selectedIndex === currentQ.answer) {
        score++;
        scoreTracker.textContent = `अंक: ${score}`;
      } else {
        buttons[selectedIndex].classList.add('wrong');
      }

      nextBtn.style.display = 'inline-block';
    }

    function toggleHint() {
      if (hintBox.style.display === 'none' || hintBox.style.display === '') {
        hintBox.style.display = 'block';
      } else {
        hintBox.style.display = 'none';
      }
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < newQuizQuestions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('finalScore').textContent = `${score} / ${newQuizQuestions.length}`;
      switchScreen('end-screen');
    }

    function restartQuiz() {
      switchScreen('intro-screen');
    }
  </script>
</body>
</html>
