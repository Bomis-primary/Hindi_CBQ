<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBQ Quiz Application</title>
<style>
  :root {
    --primary: #2563eb;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #d97706;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  
  .screen { display: none; width: 100%; max-width: 650px; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
  .screen.active { display: block; }

  /* 1. Centered Single Logo Screen */
  #logo-screen { 
    display: none; 
    min-height: 300px;
  }
  #logo-screen.active {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app-logo {
    max-width: 280px;
    max-height: 160px;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }

  /* Intro & End Screen */
  .meta-card { background: #f1f5f9; padding: 15px; border-radius: 8px; margin: 20px 0; text-align: left; }
  .meta-card p { margin: 8px 0; font-size: 1rem; }
  button.btn-action { background: var(--primary); color: white; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 6px; cursor: pointer; transition: 0.2s; }
  button.btn-action:hover { opacity: 0.9; }

  /* Game Area */
  .game-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 20px; font-weight: bold; }
  .timer-badge { background: #fee2e2; color: var(--danger); padding: 6px 12px; border-radius: 20px; font-size: 0.9rem; }
  .scenario-text { text-align: left; font-size: 1.1rem; line-height: 1.5; margin-bottom: 20px; }
  
  .options-grid { display: grid; gap: 12px; margin-bottom: 20px; }
  .btn-option { background: #ffffff; border: 2px solid #cbd5e1; padding: 14px; border-radius: 8px; font-size: 1rem; text-align: left; cursor: pointer; transition: 0.2s; }
  .btn-option:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
  .btn-option:disabled { cursor: not-allowed; }
  .btn-option.correct { background: #dcfce7; border-color: var(--success); color: #14532d; }
  .btn-option.incorrect { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; }

  .feedback-box, .hint-box { border-radius: 6px; padding: 12px; margin-top: 15px; font-weight: 600; text-align: left; }
  .hint-box { background: #fef3c7; color: var(--warning); border: 1px solid #fde68a; }
  .feedback-box.success { background: #dcfce7; color: var(--success); }
  .feedback-box.danger { background: #fee2e2; color: var(--danger); }
</style>
</head>
<body>

<!-- 1. Logo Screen (Only Logo centered) -->
<div id="logo-screen" class="screen active">
  <img src="assets/logo.png" alt="Innovine Logo" class="app-logo">
</div>

<!-- 2. Intro Screen -->
<div id="intro-screen" class="screen">
  <h2>Quiz Overview</h2>
  <div class="meta-card">
    <p><strong>Grade:</strong> Class 4</p>
    <p><strong>Subject:</strong> Hindi</p>
    <p><strong>Topic:</strong> तेनालीराम की चतुराई</p>
    <p><strong>Total Questions:</strong> <span id="intro-q-count">0</span></p>
  </div>
  <button class="btn-action" onclick="startQuiz()">Start Quiz</button>
</div>

<!-- 3. Game Area Screen -->
<div id="game-screen" class="screen">
  <div class="game-header">
    <span>Score: <span id="live-score">0</span></span>
    <span class="timer-badge">⏱️ <span id="timer">45</span>s</span>
    <span>Q: <span id="q-idx">1</span>/<span id="q-total">0</span></span>
  </div>

  <div id="scenario" class="scenario-text"></div>
  <div id="options" class="options-grid"></div>

  <div id="hint-box" class="hint-box" style="display: none;"></div>
  <div id="feedback-box" class="feedback-box" style="display: none;"></div>
</div>

<!-- 4. End Screen -->
<div id="end-screen" class="screen">
  <h2>Quiz Completed!</h2>
  <div class="meta-card" style="text-align: center;">
    <p>Your Final Score</p>
    <h1 id="final-score" style="font-size: 3rem; color: var(--primary); margin: 10px 0;">0/0</h1>
  </div>
  <button class="btn-action" onclick="restartQuiz()">Restart Quiz</button>
</div>

<script>
const quizData = [
  {
    scenario: "विजयनगर के राजमहल में अचानक हड़कंप मच गया और राजा कृष्णदेवराय बहुत चिंतित हो गए। राजकोष से कौन-कौन सी वस्तुएँ गायब हो गई थीं?",
    options: [
      "सोने के सिक्के और कीमती आभूषण",
      "किताबें और कपड़े",
      "हथियार और भोजन",
      "फूल और फल"
    ],
    answer: 0,
    hint: "राजकोष से राजा का खजाना और गहने गायब हो गए थे।"
  },
  {
    scenario: "राजा कृष्णदेवराय ने चोरी की समस्या सुलझाने के लिए तेनालीराम को कितना समय दिया था?",
    options: [
      "दो दिन का",
      "एक दिन का",
      "एक सप्ताह का",
      "एक महीने का"
    ],
    answer: 1,
    hint: "राजा ने तेनालीराम को योजना बनाने और चोर पकड़ने के लिए 24 घंटे यानी एक दिन दिया।"
  },
  {
    scenario: "तेनालीराम ने चोर को पकड़ने के लिए दरबार में एक मिट्टी की मूर्ति प्रस्तुत की। उस मूर्ति पर क्या लगाया गया था?",
    options: [
      "जादुई पानी",
      "सोने की परत",
      "काला रंग",
      "फूलों की माला"
    ],
    answer: 2,
    hint: "तेनालीराम ने ऐसा रंग लगाया जिससे छूने वाले के हाथ पर निशान पड़ जाए।"
  },
  {
    scenario: "तेनालीराम ने घोषणा की कि जो भी चोर होगा और मूर्ति को छुएगा, उसके हाथ काले हो जाएँगे। असली चोर की पहचान कैसे हुई?",
    options: [
      "उसके हाथ पूरी तरह काले थे",
      "डर के कारण उसने मूर्ति को छुआ ही नहीं और उसके हाथ साफ थे",
      "वह मूर्ति देखकर रोने लगा",
      "उसने दरबार से भागने की कोशिश की"
    ],
    answer: 1,
    hint: "चोर को लगा कि मूर्ति सचमुच जादुई है, इसलिए उसने पकड़े जाने के डर से उसे छुआ ही नहीं।"
  },
  {
    scenario: "यदि चोर ने भी अन्य दरबारियों की तरह मूर्ति को छू लिया होता, तो तेनालीराम की योजना पर क्या प्रभाव पड़ता?",
    options: [
      "चोर के हाथ भी काले हो जाते और उसे पहचानना कठिन हो जाता",
      "मूर्ति तुरंत टूट जाती",
      "राजा सभी दरबारियों को छोड़ देते",
      "महल के सभी लोगों के हाथ काले हो जाते"
    ],
    answer: 0,
    hint: "अगर चोर मूर्ति छू लेता, तो उसके हाथ भी बाकी सब की तरह काले हो जाते।"
  },
  {
    scenario: "चोरी का अपराध साबित होने पर राजा कृष्णदेवराय ने चोर दरबारी के साथ क्या करने का आदेश दिया?",
    options: [
      "उसे इनाम दिया",
      "उसे राज्य से बाहर निकाल दिया",
      "सैनिकों को उसे तुरंत बंदी बनाने और दंड देने का आदेश दिया",
      "उसे माफ कर दिया"
    ],
    answer: 2,
    hint: "राजा ने चोरी को बड़ा अपराध मानते हुए सैनिकों को कड़ा आदेश दिया।"
  },
  {
    scenario: "तेनालीराम की सूझ-बूझ से चोर के पकड़े जाने पर राजा कृष्णदेवराय ने उन्हें इनाम दिया। इस कहानी से हमें क्या सीख मिलती है?",
    options: [
      "जादू से हर समस्या हल हो जाती है",
      "बुद्धिमानी और धैर्य से कठिन समस्याओं का समाधान किया जा सकता है",
      "चोरी करना अच्छी बात है",
      "हमेशा ताकत का प्रयोग करना चाहिए"
    ],
    answer: 1,
    hint: "तेनालीराम ने अपनी समझदारी और शांति से काम लेकर बड़ी समस्या हल की।"
  },
  {
    scenario: "कहानी की शुरुआत में अमृता की प्लास्टिक की गेंद एक गहरे गड्ढे में गिर गई। उसने बिना गड्ढे में उतरे गेंद निकालने के लिए पास रखी बाल्टी के पानी का उपयोग किया। यहाँ उसने किस चीज़ का परिचय दिया?",
    options: [
      "केवल शारीरिक बल का",
      "सूझ-बूझ और बुद्धिमानी का",
      "जादू का",
      "दूसरों की सहायता का"
    ],
    answer: 1,
    hint: "पानी डालने पर हल्की प्लास्टिक की गेंद तैरकर ऊपर आ जाती है, यह दिमाग लगाने से संभव हुआ।"
  },
  {
    scenario: "विजयनगर साम्राज्य के अवशेष और प्रसिद्ध विरुपाक्ष मंदिर आज भारत के किस राज्य के 'हंपी' नामक स्थान में स्थित हैं?",
    options: [
      "राजस्थान",
      "उत्तर प्रदेश",
      "कर्नाटक",
      "गुजरात"
    ],
    answer: 2,
    hint: "यह दक्षिण भारत का एक प्रसिद्ध ऐतिहासिक राज्य है।"
  },
  {
    scenario: "दुनिया के अलग-अलग हिस्सों में तेनालीराम जैसी चतुर पात्रों की लोक-कथाएँ प्रसिद्ध हैं। मध्य पूर्व (Middle East) की लोक-कथाओं में कौन-सा चतुर पात्र प्रसिद्ध है?",
    options: [
      "रेनार्ड लोमड़ी",
      "जुहा",
      "अनांसी",
      "शेरखान"
    ],
    answer: 1,
    hint: "यूरोप में 'रेनार्ड लोमड़ी', अफ्रीका में 'अनांसी' और मध्य पूर्व में यह पात्र प्रसिद्ध है।"
  }
];

let currentQ = 0;
let score = 0;
let attempts = 0;
let timerVal = 45;
let timerInterval = null;

// Auto switch from Logo Screen to Intro Screen after 5 seconds
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('intro-q-count').textContent = quizData.length;
  setTimeout(() => {
    switchScreen('intro-screen');
  }, 5000);
});

function switchScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  currentQ = 0;
  score = 0;
  switchScreen('game-screen');
  loadQuestion();
}

function loadQuestion() {
  attempts = 0;
  timerVal = 45;
  document.getElementById('live-score').textContent = score;
  document.getElementById('q-idx').textContent = currentQ + 1;
  document.getElementById('q-total').textContent = quizData.length;
  document.getElementById('scenario').textContent = quizData[currentQ].scenario;
  
  const hintBox = document.getElementById('hint-box');
  const feedBox = document.getElementById('feedback-box');
  hintBox.style.display = 'none';
  feedBox.style.display = 'none';

  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';

  quizData[currentQ].options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'btn-option';
    btn.textContent = `${idx + 1}. ${opt}`;
    btn.onclick = () => handleAnswer(idx, btn);
    optionsDiv.appendChild(btn);
  });

  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  document.getElementById('timer').textContent = timerVal;
  timerInterval = setInterval(() => {
    timerVal--;
    document.getElementById('timer').textContent = timerVal;
    if (timerVal <= 0) {
      clearInterval(timerInterval);
      handleTimeout();
    }
  }, 1000);
}

function handleAnswer(selectedIdx, btnElement) {
  const q = quizData[currentQ];
  const feedBox = document.getElementById('feedback-box');
  const hintBox = document.getElementById('hint-box');

  if (selectedIdx === q.answer) {
    clearInterval(timerInterval);
    btnElement.classList.add('correct');
    score++;
    document.getElementById('live-score').textContent = score;
    disableAllOptions();
    feedBox.className = 'feedback-box success';
    feedBox.textContent = 'Correct!';
    feedBox.style.display = 'block';
    hintBox.style.display = 'none';
    setTimeout(nextQuestion, 1000);
  } else {
    attempts++;
    btnElement.classList.add('incorrect');
    btnElement.disabled = true;

    if (attempts === 1) {
      hintBox.textContent = `Hint: ${q.hint}`;
      hintBox.style.display = 'block';
    } else if (attempts >= 2) {
      clearInterval(timerInterval);
      disableAllOptions();
      highlightCorrectOption();
      feedBox.className = 'feedback-box danger';
      feedBox.textContent = `Incorrect! Correct answer: ${q.options[q.answer]}`;
      feedBox.style.display = 'block';
      hintBox.style.display = 'none';
      setTimeout(nextQuestion, 2000);
    }
  }
}

function handleTimeout() {
  disableAllOptions();
  highlightCorrectOption();
  const feedBox = document.getElementById('feedback-box');
  feedBox.className = 'feedback-box danger';
  feedBox.textContent = `Time expired! Correct answer: ${quizData[currentQ].options[quizData[currentQ].answer]}`;
  feedBox.style.display = 'block';
  setTimeout(nextQuestion, 2000);
}

function disableAllOptions() {
  document.querySelectorAll('.btn-option').forEach(b => b.disabled = true);
}

function highlightCorrectOption() {
  const options = document.querySelectorAll('.btn-option');
  options[quizData[currentQ].answer].classList.add('correct');
}

function nextQuestion() {
  currentQ++;
  if (currentQ < quizData.length) {
    loadQuestion();
  } else {
    endQuiz();
  }
}

function endQuiz() {
  clearInterval(timerInterval);
  document.getElementById('final-score').textContent = `${score} / ${quizData.length}`;
  switchScreen('end-screen');
}

function restartQuiz() {
  switchScreen('intro-screen');
}
</script>
</body>
</html>
